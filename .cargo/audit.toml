# cargo-audit configuration.
#
# Suppressions live here rather than as `--ignore` flags in a CI shell line, because an advisory
# waived without a written reason is indistinguishable from one nobody noticed. Every entry below
# says what was accepted, why, and what would end the acceptance.
#
# Reviewed whenever this file is touched and at every phase gate (ROADMAP.md §6).

[advisories]
ignore = [
    # RUSTSEC-2026-0002 — `lru` 0.12.5, `IterMut` violates Stacked Borrows by invalidating an
    # internal pointer. Unsoundness, not a vulnerability, and reaching it requires calling the
    # affected API.
    #
    # **Nothing in this graph calls it.** `lru` 0.12.5 has exactly one reverse dependency —
    # `milvus-sdk-rust` 2.6.0 (`cargo tree -i lru@0.12.5`) — which touches `lru` in exactly one
    # file, `src/v2/client/cache.rs`, a collection-schema cache using `get`/`put`/`get_or_load`.
    # That file contains no `iter_mut` at all; the twelve `iter_mut` calls elsewhere in the SDK are
    # on `Vec`s in unrelated modules. `IterMut` is therefore never constructed.
    #
    # Note this is a *different* `lru` from the one below: `aws-sdk-s3` pulls 0.16.4, which this
    # advisory does not affect, and the Milvus SDK pins `lru = "0.12"` — not optional, no feature
    # disables it. Two copies, two advisories, one crate name; worth reading the version.
    #
    # Accepted on that evidence, not to make a build green. What retires it is the SDK widening its
    # requirement — recheck when milvus-sdk-rust next releases. Revisit 2026-11-21 (ENC-526).
    "RUSTSEC-2026-0002",
    # RUSTSEC-2026-0253 — unsoundness (not a vulnerability) in `lru`: `LruCache::pop()` is not
    # panic-safe, so a `Drop` impl that panics mid-pop can leave a dangling reference.
    #
    # Reached only transitively: aws-sdk-s3 → lru. We neither depend on `lru` directly nor place
    # our own types in it; the cache holds the SDK's internal endpoint and credential entries.
    #
    # Accepted because there is nowhere to move to. lru 0.16.4 is the latest release, the advisory
    # names no patched version, and aws-sdk-s3 pins it. The alternatives were to drop the AWS SDK,
    # which is disproportionate to an unsoundness requiring a panicking Drop, or to vendor a patched
    # lru, which trades a known advisory for an unmaintained fork.
    #
    # This is an acceptance, not a resolution. It ends when aws-sdk-s3 bumps past the fix, and
    # `cargo audit` will say so on the first build after that — tracked as ENC-138.
    "RUSTSEC-2026-0253",

    # RUSTSEC-2026-0192 — `ttf-parser` is unmaintained. Not a vulnerability: no advisory names a
    # defect in it, only that its author will not be fixing future ones.
    #
    # Reached transitively: enclave-preview → ab_glyph → ttf-parser, to rasterise the watermark
    # (ENC-169).
    #
    # An unmaintained *parser* is normally a serious finding in this product — parsers are the
    # widest attack-surface class here, which is why `plans/M2-ACCESS-DELIVERY.md` D17 puts them out
    # of process. This one differs in the way that decides it: **it never sees attacker-controlled
    # input.** The only font it parses is `crates/preview/assets/inter-latin.ttf`, vendored in this
    # repository and compiled in with `include_bytes!`. What a viewer controls is the text — their
    # display name — and that is handled by our own code, which bounds it. No uploaded file reaches
    # ttf-parser.
    #
    # Alternatives were weighed rather than assumed: `fontdue` is a second parser with the same
    # exposure profile and no maintenance guarantee either; `resvg` and `cosmic-text` pull far more
    # code, and resvg's MPL-2.0 licence is outside this workspace's allowlist.
    #
    # An acceptance, not a resolution. It ends when ab_glyph moves to a maintained parser, or when
    # the watermark needs a font we do not ship — at which point the "input is always ours" argument
    # stops holding and this entry must be revisited rather than renewed. ENC-176, revisit
    # 2026-11-20.
    "RUSTSEC-2026-0192",

    # RUSTSEC-2024-0436 — `paste` is unmaintained. Not a vulnerability: the advisory records only
    # that the author has archived the crate, and names no defect in it.
    #
    # Reached transitively: enclave-embeddings → tokenizers 0.23.1 → paste (ENC-661).
    #
    # The property that decides this one is different from ttf-parser's, and it is stronger:
    # **`paste` is a proc-macro, so it does not exist at run time at all.** It expands identifiers
    # during compilation and contributes no code to the binary — `cargo tree -i paste` shows it as
    # `(proc-macro)`. There is no input for an attacker to control, because by the time this product
    # runs a document through a tokenizer, `paste` has been gone since the build. An unmaintained
    # crate matters here in exactly one way — nobody will fix a future soundness bug — and a
    # soundness bug in an identifier-pasting macro surfaces as a compile error, not as a run-time
    # defect.
    #
    # Alternatives were weighed rather than assumed. There is no newer `tokenizers`: 0.23.1 is the
    # latest release, so this is not a version we can move off. Writing our own tokenizer for bge-m3
    # would mean reimplementing XLM-RoBERTa SentencePiece, which is a far larger correctness risk
    # than an archived build-time macro, and `docs/12 §1.1` is explicit that we integrate other
    # people's components rather than rebuild them.
    #
    # An acceptance, not a resolution. It ends when `tokenizers` drops the dependency, or when
    # `paste` gains an advisory that names an actual defect — at which point the "it is not in the
    # binary" argument still holds but should be re-argued rather than renewed. ENC-665, revisit
    # 2026-11-25.
    "RUSTSEC-2024-0436",
]

# RUSTSEC-2023-0071 (Marvin, `rsa`) was suppressed inline until now. It is deliberately NOT listed:
# PR #21 removed the crate entirely by choosing jsonwebtoken's aws_lc_rs backend over rust_crypto,
# and `cargo tree -i rsa` now finds no such package. Keeping the suppression would mean the advisory
# stayed silent if a future dependency reintroduced `rsa` — a stale waiver is how a fixed problem
# comes back unannounced.
