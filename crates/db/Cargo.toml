[package]
name        = "enclave-db"
description = "SQLx pool, migrations, tenant-scoped query guard"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
authors.workspace      = true

[dependencies]
enclave-core = { workspace = true }
enclave-config = { workspace = true }

# `anyhow` appears here, against the usual "anyhow only in binaries" rule
# (plans/M0-FOUNDATIONS.md D2), for exactly one reason: `enclave_core::Error::Internal` *holds* an
# `anyhow::Error`, so any crate that maps its own error into the canonical type must be able to
# construct one. It is never used as this crate's own error type.
anyhow    = { workspace = true }
# `base64` and `sha2` are the cursor primitive's, and only the cursor primitive's: base64url for the
# opaque form that survives a query string, SHA-256 for the filter fingerprint bound into it. See
# src/cursor.rs.
base64    = { workspace = true }
sha2      = { workspace = true }
sqlx      = { workspace = true }
uuid      = { workspace = true }
thiserror = { workspace = true }
tracing   = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
# Every database-backed test in this crate runs against a throwaway database rather than against
# whatever `DATABASE_URL` names (`ENC-504`): the structural gates below used to apply migrations to
# the developer's own dev-stack database, which recorded checksums there and made the next run on
# another branch fail the forward-only gate on a migration nobody had touched.
#
# This is a **dev**-dependency, and the direction matters: `enclave-testing` depends on this crate
# normally, so a normal edge here would be a cycle Cargo refuses. Cargo permits the cycle precisely
# because it closes through a dev edge — the same arrangement every domain crate already has with
# `enclave-testing`, described in that crate's manifest.
enclave-testing = { workspace = true }

[lints]
workspace = true
