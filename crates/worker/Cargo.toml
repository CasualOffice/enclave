[package]
name        = "enclave-worker"
description = "Event-driven processing (extract, embed, scan, notify)"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
authors.workspace      = true

[dependencies]
enclave-core = { workspace = true }
enclave-config = { workspace = true }
enclave-db = { workspace = true }
enclave-events = { workspace = true }
enclave-audit = { workspace = true }
# The sweep deletes `retrieval_denylist` rows through `enclave_search::lift_expired` rather than
# spelling the DELETE again here. The predicate that decides whether a row is still suppressing
# lives beside the one every search reads, and two copies of it are two chances for the sweep to
# lift something the search still considers in force.
enclave-search = { workspace = true }
enclave-indexing = { workspace = true }
enclave-preview = { workspace = true }
enclave-storage = { workspace = true }
# `ENC-548`: the binary binds its own metrics socket, because a coverage pass scheduled here
# publishes into a process-wide registry that only `enclave-api` used to expose. The listener moved
# below both binaries rather than the worker depending on the API, which is backwards.
enclave-observability = { workspace = true, features = ["exposition"] }

anyhow    = { workspace = true }
async-trait = { workspace = true }
chrono    = { workspace = true }
sqlx      = { workspace = true }
thiserror = { workspace = true }
# The scheduler is the reason this is a normal dependency rather than a dev one: it owns the clock
# (`sleep`), the tasks (`spawn`) and the signal handler (`signal`).
tokio     = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "sync", "time"] }
tracing   = { workspace = true }
uuid      = { workspace = true }

[dev-dependencies]
enclave-testing = { workspace = true }
futures = { workspace = true }
bytes = "1"
url = { workspace = true }

[lints]
workspace = true

[[bin]]
name = "enclave-worker"
path = "src/main.rs"
