[package]
name        = "enclave-worker"
description = "Event-driven processing (extract, embed, scan, notify)"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
authors.workspace      = true

[dependencies]
enclave-core = { workspace = true }
enclave-config = { workspace = true }
enclave-db = { workspace = true }
enclave-events = { workspace = true }
enclave-audit = { workspace = true }
# The sweep deletes `retrieval_denylist` rows through `enclave_search::lift_expired` rather than
# spelling the DELETE again here. The predicate that decides whether a row is still suppressing
# lives beside the one every search reads, and two copies of it are two chances for the sweep to
# lift something the search still considers in force.
enclave-search = { workspace = true }
enclave-indexing = { workspace = true }
enclave-preview = { workspace = true }
enclave-storage = { workspace = true }

chrono    = { workspace = true }
sqlx      = { workspace = true }
thiserror = { workspace = true }
tracing   = { workspace = true }
uuid      = { workspace = true }

[dev-dependencies]
enclave-testing = { workspace = true }
# `tests/coverage.rs` asserts that the probe pass's reading reaches the gauges an operator scrapes.
# A dev edge only: the pass publishes through `enclave_search::health::probe`, which is where the
# reading is computed, so nothing in this crate's library half knows the metrics exist.
enclave-observability = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
bytes = "1"
url = { workspace = true }
# `sync` for the mutex that serialises the tests reading those process-wide gauges: the fixture
# tenant ids are deterministic, so two tests probing `tenant-alpha` at once would read each other's
# numbers.
tokio           = { workspace = true, features = ["rt-multi-thread", "macros", "sync"] }

[lints]
workspace = true

[[bin]]
name = "enclave-worker"
path = "src/main.rs"
