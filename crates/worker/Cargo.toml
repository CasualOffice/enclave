[package]
name        = "enclave-worker"
description = "Event-driven processing (extract, embed, scan, notify)"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
authors.workspace      = true

[dependencies]
enclave-core = { workspace = true }
enclave-config = { workspace = true }
enclave-db = { workspace = true }
enclave-events = { workspace = true }
enclave-audit = { workspace = true }
# The sweep deletes `retrieval_denylist` rows through `enclave_search::lift_expired` rather than
# spelling the DELETE again here. The predicate that decides whether a row is still suppressing
# lives beside the one every search reads, and two copies of it are two chances for the sweep to
# lift something the search still considers in force.
enclave-search = { workspace = true }
# `ENC-557`/`ENC-533`: the indexing pass is the one place that legitimately depends on both the
# embedding port and the vector store, which is what lets the collection's dense width be checked
# against `enclave_embeddings::model::ACTIVE.dimension` at the point a stage is built. Neither
# `enclave-search` nor `enclave-embeddings` may take that edge on the other — `crates/search`'s
# `MilvusConfig::dimension` says so at length — because a dependency added to hold a constant is a
# dependency invented for an assertion.
enclave-embeddings = { workspace = true }
enclave-indexing = { workspace = true }
enclave-preview = { workspace = true }
enclave-storage = { workspace = true }
# `ENC-548`: the binary binds its own metrics socket, because a coverage pass scheduled here
# publishes into a process-wide registry that only `enclave-api` used to expose. The listener moved
# below both binaries rather than the worker depending on the API, which is backwards.
enclave-observability = { workspace = true, features = ["exposition"] }

anyhow    = { workspace = true }
async-trait = { workspace = true }
chrono    = { workspace = true }
sqlx      = { workspace = true }
thiserror = { workspace = true }
# The scheduler is the reason this is a normal dependency rather than a dev one: it owns the clock
# (`sleep`), the tasks (`spawn`) and the signal handler (`signal`).
tokio     = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "sync", "time"] }
tracing   = { workspace = true }
uuid      = { workspace = true }

[dev-dependencies]
enclave-testing = { workspace = true }
# `ENC-577`'s end-to-end test confirms a search hit through the real post-filter, which needs a real
# `AuthorizationService`. A dev edge only: the worker never authorizes anything itself.
enclave-authorization = { workspace = true }
# `ENC-557`'s last test runs the whole pass against a real collection, and setting `Strong`
# consistency for a write-then-read is the SDK's own type. `crates/search/tests/vector_write.rs`
# takes the same dependency for the same reason: the knob is what stops the test sleeping.
milvus-sdk-rust = { workspace = true }
futures = { workspace = true }
bytes = "1"
url = { workspace = true }

[lints]
workspace = true

[[bin]]
name = "enclave-worker"
path = "src/main.rs"
