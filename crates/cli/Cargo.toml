[package]
name        = "enclave-cli"
description = "Operator and developer command line: seeding, diagnostics"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
authors.workspace      = true

[dependencies]
enclave-core = { workspace = true }
enclave-config = { workspace = true }
enclave-db   = { workspace = true }
# `set-password` hashes with the same `PasswordHasher` the login path verifies with (`ENC-687`).
# A second hasher here would be a second place the Argon2 parameters are chosen, and the failure
# mode of that divergence is an account that cannot sign in with the password it was just given.
enclave-auth = { workspace = true }
# And normalises the address with the same function the login path looks it up by. A credential
# written under a differently-normalised key is a credential no login can find.
enclave-identity = { workspace = true }
# The fixtures are defined once, in the test harness, and reused here. A second
# definition of "a seeded tenant" would drift from the one every test asserts
# against, and the drift would show up as tests that pass while the stack a
# contributor is looking at is different (plans/M0-FOUNDATIONS.md D7).
enclave-testing = { workspace = true }
# `reclaim-uploads` runs `enclave_uploads::reclaim_stranded` — the same pass the tests exercise,
# rather than a second implementation of "which session is stranded" that could disagree with it.
# The store is needed because the repair deletes staged objects; see `reclaim.rs`.
enclave-uploads = { workspace = true }
enclave-storage = { workspace = true }
anyhow       = { workspace = true }
chrono       = { workspace = true }
# Not yet in [workspace.dependencies]; see the ENC-115 report — the integrator
# promotes this to the workspace manifest so a second crate cannot pick another
# major version.
clap         = { version = "4", features = ["derive"] }
sqlx         = { workspace = true }
tokio        = { workspace = true }
uuid         = { workspace = true }

[[bin]]
name = "enclave-cli"
path = "src/main.rs"

[lints]
workspace = true
