[package]
name        = "enclave-api"
description = "HTTP surface, policy enforcement, MCP gateway"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
authors.workspace      = true

[dependencies]
enclave-core = { workspace = true }
enclave-config = { workspace = true }
enclave-db = { workspace = true }
enclave-events = { workspace = true }
enclave-audit = { workspace = true }
enclave-auth = { workspace = true }
enclave-authorization = { workspace = true }
enclave-conditional_access = { workspace = true }
enclave-information_barriers = { workspace = true }
enclave-classification = { workspace = true }
enclave-dlp = { workspace = true }
enclave-retention = { workspace = true }
# `POST /api/v1/search`. The post-filter, the lexical generator and the degraded envelope all live
# there; this crate holds none of that logic and must not grow any (crates/api/src/routes/search.rs).
enclave-search = { workspace = true }
enclave-files = { workspace = true }
# `normalize_email` on the login path: the writer of `users.normalized_email` and its reader must
# fold identically, or a login lookup finds a second row for the same person (crates/identity).
enclave-identity = { workspace = true }
# ENC-690: the upload and sharing routes. Both crates were complete and depended on by nothing —
# these two lines are the whole of what `crates/api` was missing to have a write path.
enclave-libraries = { workspace = true }
enclave-sharing = { workspace = true }
enclave-uploads = { workspace = true }
# The rendition pipeline, behind `PreviewPipeline`.
enclave-preview = { workspace = true }
enclave-versions = { workspace = true }
enclave-observability = { workspace = true, features = ["exposition"] }
# The delivery paths: `download` mints a signed URL through `BlobStore`; `preview` deliberately
# does not depend on it at the module level (crates/api/src/preview.rs).
# For the `Delivery` type the router takes, and the unconfigured store behind it. The *handler*
# still holds no `BlobStore` — `preview.rs` takes a `PreviewPipeline`, which has no method that
# could mint a URL — and that remains the property; this dependency is the router's, not its.
enclave-storage = { workspace = true }

anyhow       = { workspace = true }
async-trait  = { workspace = true }
axum         = { workspace = true }
chrono       = { workspace = true }
serde        = { workspace = true }
serde_json   = { workspace = true }
sqlx         = { workspace = true }
tokio        = { workspace = true }
tower-http   = { workspace = true }
tracing      = { workspace = true }
uuid         = { workspace = true }

[dev-dependencies]
# Decoding the stub rendition and the marked response in the delivery tests.
image = { workspace = true }
enclave-testing = { workspace = true }
tower = { workspace = true }
serde_json = { workspace = true }
# `tests/delivery.rs` implements a `BlobStore` that counts the URLs it is asked to mint, and
# `tests/uploads.rs` one that records what it was asked to stage.
url = { workspace = true }

[lints]
workspace = true

[lib]
name = "enclave_api"
path = "src/lib.rs"

[[bin]]
name = "enclave-api"
path = "src/main.rs"
