[package]
name        = "enclave-search"
description = "Query planning, hybrid retrieval, post-filter"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
authors.workspace      = true

[dependencies]
enclave-core = { workspace = true }
# `MilvusConfig::from_operator_config` (`ENC-880`). The conversion from the `search.milvus` section
# to this crate's client settings used to live in `crates/worker/src/main.rs`, where `crates/api`
# could not reach it — so the API process held no vector index and every search reported itself
# degraded (`ENC-698`). It lives beside the type it builds, exactly as
# `enclave_storage::S3Config::from_operator_config` does, so two binaries reading one section cannot
# come to mean two different things by it. `enclave-config` depends only on `enclave-core`, so this
# adds no cycle.
enclave-config = { workspace = true }
enclave-db   = { workspace = true }
# The post-filter publishes its drop counts where it computes them (`postfilter.rs`), so the drop
# ratio has exactly one producer. `observability` depends only on `core`, so this adds no cycle.
enclave-observability = { workspace = true }

anyhow    = { workspace = true }
async-trait = { workspace = true }
chrono    = { workspace = true }
milvus-sdk-rust = { workspace = true }
# Filter values are bound as templates rather than formatted into the expression
# (`src/milvus.rs`), and the SDK takes those bindings as JSON.
serde_json = { workspace = true }
sqlx      = { workspace = true }
# `sync` for the lock guarding the lazily-established Milvus session. A `std` lock cannot be held
# across the `.await` that reconnects, and dropping it around the connect is what lets every
# request in an outage start its own attempt.
tokio     = { workspace = true, features = ["sync"] }
thiserror = { workspace = true }
uuid      = { workspace = true }

[dev-dependencies]
enclave-authorization = { workspace = true }
enclave-testing       = { workspace = true }
# `tests/lexical_content.rs` stores its chunk text through the writer that ships
# (`enclave_indexing::write_chunks`) rather than through hand-written SQL. The two halves of
# `ENC-515` are a table written by one crate and read by another, and the interesting failure is
# them disagreeing about it — which a test that spells the INSERT itself cannot see. A dev edge
# only: nothing in this crate's library half knows indexing exists.
enclave-indexing      = { workspace = true }
async-trait           = { workspace = true }
tokio                 = { workspace = true, features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true
