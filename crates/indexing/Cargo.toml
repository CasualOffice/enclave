[package]
name        = "enclave-indexing"
description = "Extraction, chunking, manifests, invalidation"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
authors.workspace      = true

[dependencies]
enclave-core    = { workspace = true }
# The extraction budget is `enclave-preview`'s, not a second one. `plans/M3-DISCOVERY.md` D24 says
# extraction reuses the bounds rendering already has, and it also puts both parsers in the same D17
# worker — so the two are co-resident by design and this edge costs that process nothing it was not
# already carrying. `src/extract.rs` names the three places extraction genuinely differs.
enclave-preview = { workspace = true }

anyhow      = { workspace = true }
async-trait = { workspace = true }
# The OCR engine and its inference runtime. `plans/M3-DISCOVERY.md` Q12; the workspace manifest
# carries the argument for this pair over a Tesseract binding, and `src/ocr.rs` carries the
# argument for what it is allowed to be handed.
ocrs        = { workspace = true }
rten        = { workspace = true }
# The PDF page rasteriser behind `PageImages` (`ENC-537`). OCR needs pixels; `src/pdf.rs` says why
# it lives here rather than in `enclave-preview`, whose `raster.rs` refuses `PdfSanitized` and
# continues to. The workspace manifest carries the licence and ABI argument.
pdfium-render = { workspace = true }
# The same decoder `enclave-preview` uses, with the same three formats, so a page image and a
# preview are read by one parser rather than two that agree until one is upgraded. `src/ocr.rs`
# repeats raster.rs's sniff â header â decide â decode order, which needs
# `ImageReader::into_decoder` and `total_bytes()`.
image       = { workspace = true }
# `src/store.rs` writes chunk text to PostgreSQL so the degraded search path can match on it. Plain
# `sqlx` rather than `enclave-db`: this crate opens no pool and starts no transaction — it takes the
# caller's `&mut PgConnection`, which is what lets a chunk write share the transaction that moves
# `index_manifests`.
sqlx        = { workspace = true }
#  gives the deterministic chunk ids docs/07 §2 specifies.
uuid        = { workspace = true }
thiserror   = { workspace = true }
# `BoundedExtractor` enforces the wall clock with `tokio::time::timeout`, and every parser runs on
# `spawn_blocking`; see `src/text.rs` for why that placement is the bound rather than a nicety.
tokio       = { workspace = true }

[dev-dependencies]
# `test-util` gives `#[tokio::test(start_paused = true)]`, which makes the wall-clock bound testable
# deterministically instead of as a race against a real clock.
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "test-util"] }
# `tests/chunk_store.rs` runs against a real PostgreSQL: the properties it asserts are properties of
# a statement, and a fake connection would only prove that the code calls the code.
enclave-testing = { workspace = true }
# `TenantScoped` is how a test writes as the application role with a tenant set, which is the only
# way an RLS assertion means anything — the harness's own connection is a superuser.
enclave-db      = { workspace = true }
chrono          = { workspace = true }
# `tests/ocr.rs` rasterises a known string and asserts the engine reads it back. Borrowed from
# `enclave-preview`'s watermark compositor rather than vendored a second time — the face is already
# in this repository, and a second copy of a font file is a second thing to keep in step with
# `crates/preview/assets/README.md`'s licensing note. A committed scan would be the alternative, and
# a binary fixture is content nobody reviews in a diff.
ab_glyph        = { workspace = true }

[lints]
workspace = true
