[package]
name        = "enclave-workflows"
description = "Workflow engine: stages, steps, approvals, automation"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
authors.workspace      = true

[dependencies]
enclave-core = { workspace = true }
# `TenantScoped` and the id helpers. `CLAUDE.md`'s Rust conventions: all database access through
# this crate's guard, and no `sqlx::query!` anywhere — the repository below uses the runtime-checked
# form, which is the shape `enclave-db`'s own crate header documents for a domain crate.
enclave-db   = { workspace = true }

chrono      = { workspace = true }
serde       = { workspace = true }
serde_json  = { workspace = true }
sqlx        = { workspace = true }
thiserror   = { workspace = true }
uuid        = { workspace = true }

[lints]
workspace = true
