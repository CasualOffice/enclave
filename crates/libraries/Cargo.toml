[package]
name        = "enclave-libraries"
description = "Libraries, settings, content types"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
authors.workspace      = true

[dependencies]
enclave-core = { workspace = true }
# For `Sql`/`SqlId` (typed ids bind as `uuid`) and `DbError`'s retryability classification. The
# repository never takes a pool from it — it takes the `&mut PgConnection` a `TenantScoped`
# transaction derefs to (plans/M1-CONTENT-CORE.md D10). It also owns the pagination primitives
# (`Cursor`, `PageSize`, `FilterFingerprint`) and `normalize_slug` this crate's listings use —
# `ENC-137` moved them there from `enclave-identity`, which was a sideways edge between domain
# crates.
enclave-db = { workspace = true }

anyhow     = { workspace = true }
chrono     = { workspace = true }
# `allowed_extensions` and `blocked_extensions` are JSONB. The shape the database does not enforce
# is enforced in src/row.rs, which needs a JSON value type to enforce it against.
serde_json = { workspace = true }
sqlx       = { workspace = true }
thiserror  = { workspace = true }
tracing    = { workspace = true }

[dev-dependencies]
enclave-testing = { workspace = true }
tokio = { workspace = true }

[lints]
workspace = true
