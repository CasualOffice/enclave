[package]
name        = "enclave-identity"
description = "Users, groups, guests, service accounts, LDAP/OIDC/SAML/SCIM"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
authors.workspace      = true

[dependencies]
enclave-core = { workspace = true }
# For `Sql`/`SqlId` (typed ids bind as `uuid`) and `DbError`'s retryability classification. The
# repositories never take a pool from it — they take the `&mut PgConnection` a `TenantScoped`
# transaction derefs to (plans/M1-CONTENT-CORE.md D10).
enclave-db = { workspace = true }

anyhow      = { workspace = true }
async-trait = { workspace = true }
base64      = { workspace = true }
chrono      = { workspace = true }
sha2        = { workspace = true }
sqlx        = { workspace = true }
thiserror   = { workspace = true }
tracing     = { workspace = true }
uuid        = { workspace = true }

[dev-dependencies]
enclave-testing = { workspace = true }
tokio = { workspace = true }

[lints]
workspace = true
