[package]
name        = "enclave-preview"
description = "Rendition generation, sanitization, watermarking"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
authors.workspace      = true

[dependencies]
enclave-core    = { workspace = true }
enclave-db      = { workspace = true }
enclave-storage = { workspace = true }

anyhow      = { workspace = true }
async-trait = { workspace = true }
# The five below exist for `print.rs` alone, and each is the same choice the other capability in
# this product already made: `crates/sharing`'s share token is 256 bits of `rand` from the OS
# CSPRNG, `base64`-url-encoded, stored as its `sha2` digest, compared in constant time with
# `subtle`, and held in a `zeroize` wrapper so the plaintext does not outlive the response.
base64      = { workspace = true }
chrono      = { workspace = true }
rand        = { workspace = true }
sha2        = { workspace = true }
subtle      = { workspace = true }
zeroize     = { workspace = true }
# The raster decoder. Chosen for header-before-pixels inspection, and pinned to three formats — see
# the note in the workspace manifest and the bound in `src/raster.rs`.
ab_glyph    = { workspace = true }
image       = { workspace = true }
sqlx        = { workspace = true }
thiserror   = { workspace = true }
# One line, in `blob.rs`: an object that outgrew the budget between its row being written and its
# bytes being read is worth knowing about, and it is not the caller's fault.
tracing     = { workspace = true }
# `Bounded` enforces the wall clock with `tokio::time::timeout`; see `render.rs` for why that bound
# is the pipeline's promise to its caller rather than a promise about the parser.
tokio       = { workspace = true }
uuid        = { workspace = true }

[dev-dependencies]
enclave-testing = { workspace = true }
# Both are here to *build* an `enclave_storage::ByteStream` — the store fake in `blob.rs`'s tests
# is the only thing in the workspace that constructs one rather than collecting one.
bytes           = { workspace = true }
futures         = { workspace = true }
url             = { workspace = true }
# Used in `tests/raster.rs` to read a rendition's *pixels* back, for the one assertion that a
# hand-parsed header cannot make: that the image is the source's and not a correctly-sized blank.
# The header assertions deliberately do not go through it — see that file's module documentation.
image           = { workspace = true }
# `test-util` gives `#[tokio::test(start_paused = true)]`, which makes the wall-clock bound
# testable deterministically instead of as a race against a real clock.
# `sync` is for `tests/print_tokens.rs`: the two-replica race needs a `Barrier` to hold both
# transactions open until they can contend for the same row, rather than hoping the scheduler
# interleaves them.
tokio           = { workspace = true, features = ["rt-multi-thread", "macros", "time", "test-util", "sync"] }
# The print-token tests write their own `file_versions` rows; the spine helper does not.
chrono          = { workspace = true }
uuid            = { workspace = true }
sqlx            = { workspace = true }

[lints]
workspace = true
