[package]
name        = "enclave-files"
description = "Files, folders, moves, trash"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
authors.workspace      = true

[dependencies]
enclave-core = { workspace = true }
# For `Sql`/`SqlId` (typed ids bind as `uuid`) and `DbError`'s retryability classification. No pool
# is taken from it — every repository function takes the `&mut PgConnection` a `TenantScoped`
# transaction derefs to (plans/M1-CONTENT-CORE.md D10).
enclave-db = { workspace = true }
# Only for `Cursor`, `PageSize` and `FilterFingerprint`. Nothing about principals is read here.
# Pagination is not an identity concern and this dependency is an accident of where the cursor was
# first needed (`ENC-125`); see the crate documentation for the note handed to the integrator.

anyhow    = { workspace = true }
chrono    = { workspace = true }
sqlx      = { workspace = true }
thiserror = { workspace = true }
tracing   = { workspace = true }
# `normalized_name` is "casefolded + NFC" (docs/04-DATA-MODEL.md §8), and NFC is not in std.
# Pinned locally because the workspace has no entry for it yet — it is the first direct use, though
# the version matches the one already in Cargo.lock via `url`/`idna`, so no new tree is pulled in.
unicode-normalization = "0.1"

[dev-dependencies]
enclave-testing = { workspace = true }
tokio = { workspace = true }

[lints]
workspace = true
