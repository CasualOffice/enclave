[workspace.package]
version      = "0.1.0"
edition      = "2021"
rust-version = "1.96"
license      = "Apache-2.0"
repository   = "https://github.com/CasualOffice/enclave"
authors      = ["Casual Office"]

# Every shared dependency is pinned once, here. Crates inherit with
# `workspace = true` so two crates can never disagree on a version.
[workspace.dependencies]
# internal
enclave-api = { path = "crates/api" }
enclave-worker = { path = "crates/worker" }
enclave-scheduler = { path = "crates/scheduler" }
enclave-core = { path = "crates/core" }
enclave-config = { path = "crates/config" }
enclave-db = { path = "crates/db" }
enclave-events = { path = "crates/events" }
enclave-audit = { path = "crates/audit" }
enclave-auth = { path = "crates/auth" }
enclave-identity = { path = "crates/identity" }
enclave-authorization = { path = "crates/authorization" }
enclave-conditional_access = { path = "crates/conditional_access" }
enclave-information_barriers = { path = "crates/information_barriers" }
enclave-classification = { path = "crates/classification" }
enclave-dlp = { path = "crates/dlp" }
enclave-incidents = { path = "crates/incidents" }
enclave-retention = { path = "crates/retention" }
enclave-legal_hold = { path = "crates/legal_hold" }
enclave-records = { path = "crates/records" }
enclave-workspaces = { path = "crates/workspaces" }
enclave-libraries = { path = "crates/libraries" }
enclave-files = { path = "crates/files" }
enclave-versions = { path = "crates/versions" }
enclave-uploads = { path = "crates/uploads" }
enclave-metadata = { path = "crates/metadata" }
enclave-lists = { path = "crates/lists" }
enclave-pages = { path = "crates/pages" }
enclave-sharing = { path = "crates/sharing" }
enclave-search = { path = "crates/search" }
enclave-indexing = { path = "crates/indexing" }
enclave-embeddings = { path = "crates/embeddings" }
enclave-mcp = { path = "crates/mcp" }
enclave-storage = { path = "crates/storage" }
enclave-secrets = { path = "crates/secrets" }
enclave-mail = { path = "crates/mail" }
enclave-antivirus = { path = "crates/antivirus" }
enclave-preview = { path = "crates/preview" }
enclave-ai = { path = "crates/ai" }
enclave-sync = { path = "crates/sync" }
enclave-notifications = { path = "crates/notifications" }
enclave-workflows = { path = "crates/workflows" }
enclave-signing = { path = "crates/signing" }
enclave-branding = { path = "crates/branding" }
enclave-observability = { path = "crates/observability" }
enclave-testing = { path = "crates/testing" }
enclave-cli = { path = "crates/cli" }

# async runtime and http
tokio        = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "fs"] }
axum         = { version = "0.8", features = ["macros"] }
tower        = "0.5"
tower-http   = { version = "0.7", features = ["trace", "cors", "limit", "timeout"] }
hyper        = "1"

# data
sqlx         = { version = "0.9", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json", "macros", "migrate"] }
uuid         = { version = "1", features = ["v4", "v5", "v7", "serde"] }
chrono       = { version = "0.4", features = ["serde"] }

# serialization
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
serde_yaml   = "0.9"

# errors and tracing
thiserror    = "2"
anyhow       = "1"
tracing      = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# crypto and auth
argon2       = "0.5"
ed25519-dalek = { version = "3", features = ["rand_core", "pkcs8", "alloc"] }
# 11 made the crypto backend pluggable and requires exactly one provider.
#
# aws_lc_rs, not rust_crypto. The first choice here WAS rust_crypto — pure Rust, no C toolchain,
# simple cross-compilation — and cargo-deny rejected it: `rust_crypto` pulls `rsa` unconditionally,
# and `rsa` carries RUSTSEC-2023-0071, the Marvin timing sidechannel, with no fixed release.
#
# We pin EdDSA and never construct an RSA key, so the vulnerable path is unreachable. That argument
# is available and was not taken: "unreachable" is a claim about today's call graph, checked by
# nobody, and it is the same reasoning this codebase rejects when a gate is inconvenient. Not
# shipping the code is stronger than reasoning about whether it runs.
#
# aws_lc_rs removes `rsa` from the tree entirely and clears the advisory. The costs are real — a C
# toolchain in the build and more care when cross-compiling — and are accepted deliberately. FIPS
# capability comes along as a side effect rather than a goal; key custody still belongs to the
# KMS/HSM path in docs/08-BYO-INFRA.md §7.
jsonwebtoken = { version = "11", default-features = false, features = ["aws_lc_rs"] }
sha2         = "0.11"
rand         = "0.10"
base64       = "0.23"
subtle       = "2"
zeroize      = { version = "1", features = ["derive"] }

# rendering
#
# `image` rather than the per-format decoder crates directly, for one property that decides this
# task: `ImageReader::into_decoder` yields a decoder that already knows the image's dimensions and
# its `total_bytes()` *before* a pixel buffer exists, and `Limits::max_alloc` is checked inside the
# decoder before it allocates. A decoder whose only verb is "give me the pixels" makes the decode
# bomb — a 70-byte file declaring 65535×65535 — unbounded by construction, and no wrapper outside it
# can fix that. See `crates/preview/src/raster.rs`.
#
# `default-features = false`, then formats added one at a time. Every enabled format is a parser we
# ship inside a customer's trust boundary, and the default set is fourteen of them including exr,
# tga and dds — formats nobody uploads and nobody has fuzzed on our behalf. The three here are the
# ones `raster.rs` allowlists; the two lists are asserted equal rather than assumed so.
#
# `rayon` stays off. Renders already run on `spawn_blocking` threads the runtime sizes, and a second
# thread pool nested inside the parser is parallelism nobody is accounting for — including the
# per-render CPU bound `docs/06 §5` asks for.
# Glyph rasterisation for the watermark compositor (`ENC-169`). Chosen over an SVG renderer
# because `resvg` is MPL-2.0 and this workspace's licence allowlist is deliberate — and because a
# watermark is a few lines of text, so a whole SVG engine would be a large new parser (the widest
# attack surface class in this product) to draw what a glyph rasteriser draws directly.
ab_glyph     = "0.2"
image        = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }

# misc
async-trait  = "0.1"
futures      = "0.3"
# 0.21 made serde opt-in; 0.20 enabled it by default. TrustedProxy.cidr is deserialised
# straight from configuration, so the feature is load-bearing rather than convenience.
ipnetwork    = { version = "0.21", features = ["serde"] }
url          = "2"

# vector store
#
# The official SDK, and the reason it is the official one matters here: the wire protocol is
# protobuf generated from Milvus's own `.proto` files, so the alternative to this crate is
# maintaining a generated gRPC client against a moving schema.
#
# Licence note, because `cargo deny check licenses` reports it as a warning rather than a clean
# pass. The crate declares no SPDX `license` field — it uses `license-file = "LICENSE"`, and that
# file is the Apache-2.0 text, which cargo-deny matches and accepts against this workspace's
# allowlist. So it *is* Apache-2.0 and no exception was needed, but the metadata says so only by
# textual match rather than by declaration, and a `no-license-field` warning is what that looks
# like. If askalono's match ever drops below the 0.93 confidence threshold in deny.toml this
# becomes a build failure with no code change, so the warning is worth leaving visible rather than
# suppressing.
milvus-sdk-rust = "2.6.0"

# optical character recognition
#
# `plans/M3-DISCOVERY.md` Q12, answered 2026-08-21: `ocrs` on `rten`, English (Latin script) only.
#
# The decisive property is not accuracy, it is the **absence of a `links` key**. Both Rust bindings
# to Tesseract (`tesseract`, `leptess`) declare `links = "tesseract"`, so they cannot coexist in one
# dependency graph, and either one puts libtesseract and libleptonica — two large C parsers — inside
# the D17 worker whose entire design is about not trusting parsers. `ocrs`/`rten` is pure Rust, MIT
# OR Apache-2.0 across its tree, and adds no system library. `unsafe_code = "forbid"` applies to this
# workspace's crates and not to a dependency's, so this is not a claim that `rten` contains no
# `unsafe` — only that nothing here has to build or link a C toolchain to use it.
#
# **`rayon` comes with it, and that contradicts the note on `image` above.** `rten` depends on
# `rayon` unconditionally (there is no feature that removes it) and sizes its global pool from the
# physical core count, so OCR nests a thread pool inside the `spawn_blocking` thread the extractor
# already runs on — exactly the parallelism the `image` note declines to accept. Taken anyway,
# because the alternative is a C OCR engine that also threads and additionally brings a C toolchain,
# and because the bound is available from outside: `rten` reads `RTEN_NUM_THREADS`, so the D17
# worker's deployment sets it alongside the process CPU limit. `crates/indexing/src/ocr.rs` says the
# same thing where an operator will read it; nothing in library code sets the variable, because a
# library mutating the process environment is a global side effect its caller never asked for.
#
# `rten` is taken with `default-features = false` plus `rten_format`: the default set also enables
# `onnx_format`, which is a second model-file parser reading a format we do not ship weights in. An
# enabled parser nobody uses is still a parser in the image (the same argument the `image` pin
# makes), and the `.rten` models are the only ones `ocrs` publishes.
ocrs         = "0.12.2"
rten         = { version = "0.24.0", default-features = false, features = ["rten_format"] }

# pdf page rasterisation
#
# `ENC-537`. OCR needs pixels and nothing in this repository turned a PDF page into any, so the
# exit criterion "a scanned, text-free PDF is searchable by its content" had no implementation to
# be true of. `crates/indexing/src/pdf.rs` carries the argument for where it runs.
#
# **The alternatives, and why they are not here.** `mupdf` is the most capable option and is
# **AGPL-3.0**: the licence allowlist in `deny.toml` excludes it, and unlike the OCR weights this is
# a case `cargo deny` would actually catch — worth knowing to be unavailable before somebody reaches
# for it under deadline. `pdf` and `lopdf` are MIT and are *parsers*: they give a page tree, not
# pixels, and writing a renderer on top of one is writing a PDF renderer.
#
# **The decisive property, as with `ocrs`, is how the native code arrives.** `libloading` is a
# non-optional dependency and no `-sys` crate appears in the graph, so PDFium is opened with
# `dlopen` at run time. No `links` key, no C++ toolchain in our build, and nothing to conflict with
# — the trap that disqualified the Tesseract bindings for OCR. The deployment supplies
# `libpdfium`, which is the mounted-at-runtime shape the OCR weights (`ENC-535`) and the embedding
# model (`ENC-534`) already have, so there is one operator story rather than three.
#
# **What is being taken on, stated plainly.** PDFium is a large C++ parser — the widest
# attack-surface class in this product, and the first one in the graph that is not memory-safe. That
# is not made acceptable by this line; it is made acceptable by where the code runs and by the fact
# that a deployment which mounts nothing has `NoPageImages`. `plans/M3-THREAT-WALKTHROUGH.md §3` R10
# records the residual, and D17's out-of-process worker is what closes it.
#
# `default-features = false`, then two features back on, for the same reason `image` and `rten` are
# pinned that way:
#
#   * `pdfium_7881` rather than `pdfium_latest`. The feature selects which PDFium exports the
#     bindings resolve at `dlopen` time, and every one of them is resolved eagerly — so the feature
#     and the mounted binary are an ABI pair. `pdfium_latest` moves when this crate is upgraded,
#     which would silently change which binaries load; naming the version means an upgrade is a diff
#     that also names the binary CI fetches.
#   * `thread_safe` is not optional in the ordinary sense. PDFium makes no thread-safety guarantee
#     and its authors recommend against threading it at all; this feature serialises every call
#     behind a mutex. Extraction runs on `spawn_blocking` threads, so without it the first two
#     concurrent documents are undefined behaviour in C++.
#
# `image_latest` is left **off**, which is the default set's third member. It would add a second
# `image` edge whose feature set is chosen by this crate rather than by us, and the property
# `crates/preview/src/raster.rs` asserts — that the enabled decoders and the allowlist are one set —
# is worth more than the `PdfBitmap::as_image()` convenience. `src/pdf.rs` takes the RGBA buffer and
# encodes it with the workspace's own `image`.
pdfium-render = { version = "0.9.3", default-features = false, features = ["pdfium_7881", "thread_safe"] }

# dev
trybuild     = "1"

# Lints are declared once and inherited by every crate via `[lints] workspace = true`.
[workspace.lints.rust]
unsafe_code             = "forbid"
missing_debug_implementations = "warn"
unreachable_pub         = "warn"
rust_2018_idioms        = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all                     = { level = "warn", priority = -1 }
# `PolicyDecision` and `Obligations` are #[must_use]; dropping one must never
# be silent. See plans/M0-FOUNDATIONS.md D2 and docs/03-LLD.md §12.
let_underscore_must_use = "deny"
unwrap_used             = "warn"
expect_used             = "warn"
panic                   = "warn"
todo                    = "allow"          # scaffolding; tightened at gate G0

[profile.release]
lto           = "thin"
codegen-units = 1
strip         = "debuginfo"

[profile.dev]
debug = 1
