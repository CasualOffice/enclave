# Supply-chain gate: advisories, licences, sources, and an SBOM.
#
# This runs on a schedule as well as on pull requests because a dependency becomes
# vulnerable without anyone touching the repository — a repo that only checks on
# PRs is unaudited for as long as it is quiet, which is exactly when it looks safe.
#
# ---------------------------------------------------------------------------
# Fetching is retried; auditing is not.
#
# Every job here reaches crates.io twice for different reasons: once to install
# its tool, once to resolve the dependency graph it is about to judge. Neither is
# the judgement. On 2026-08-20 index.crates.io returned 503 and the failure
# surfaced under a check named after a security rule; in this workflow the same
# outage would read as "cargo audit — no known-vulnerable dependency" failing,
# which is a sentence that means a vulnerability was found. It would not have
# been. A red check that can mean either is one people stop believing, and the
# one it costs is the true one.
#
# So each fetch is a step of its own, bounded-retried, and names the registry
# when it gives up. The audit itself gets exactly ONE attempt, always: retrying
# `cargo audit` or `cargo deny` until it passes is a way of not knowing about an
# advisory. If either is genuinely flaky, that is a defect to fix, not to loop.
# ---------------------------------------------------------------------------
name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Mondays 05:23 UTC. An odd minute avoids the top-of-hour scheduling backlog.
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # On a pull request the group is the PR, and a new push cancels the run in flight: only
  # the tip is worth testing. On a push to `main` the group is the **commit**, and that is
  # the part that is easy to get wrong. `cancel-in-progress: false` stops a running job
  # being killed, but it does not stop a newly queued run from displacing the one already
  # *pending* in the same group — so three merges nineteen seconds apart left two of the
  # three commits on `main` with cancelled checks and only the last one tested.
  #
  # That reads as a red `main`. A cancelled required check is indistinguishable from a
  # failing one in the merge box, so the next pull request cannot be merged and the cause
  # is a scheduling artefact rather than anything in the tree. Keying on `github.sha`
  # gives every commit on `main` its own group, which is what "every commit on main is
  # tested" actually requires.
  group: security-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # Bump to force a rebuild of the cached CI tool binaries (new tool release,
  # corrupted cache, toolchain change).
  TOOL_CACHE_EPOCH: "1"

jobs:
  audit:
    name: cargo audit — no known-vulnerable dependency
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install the pinned toolchain
        run: |
          set -euo pipefail
          channel=$(grep -E '^[[:space:]]*channel' rust-toolchain.toml | head -1 | sed -E 's/.*"(.*)".*/\1/')
          rustup toolchain install "$channel" --profile minimal --no-self-update
          rustup default "$channel"
          rustc --version

      - name: Cache cargo-audit binary
        id: audit-cache
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/cargo-audit
          key: ${{ runner.os }}-cargo-audit-${{ env.TOOL_CACHE_EPOCH }}-${{ hashFiles('rust-toolchain.toml') }}

      # Retried: installing the tool is a registry download, not a verdict.
      - name: Install cargo-audit
        if: steps.audit-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4; do
            if cargo install --locked cargo-audit; then
              echo "cargo-audit installed on attempt ${attempt}"
              exit 0
            fi
            if [ "$attempt" -lt 4 ]; then
              delay=$((attempt * attempt * 5))
              echo "crates.io fetch failed (attempt ${attempt}/4); retrying in ${delay}s"
              sleep "$delay"
            fi
          done
          echo "::error title=Dependency registry unavailable — NOT an advisory::cargo could not install cargo-audit from index.crates.io after 4 attempts over ~70s. No audit ran: no advisory was found and none was ruled out. Check https://status.crates.io and re-run the job."
          exit 1

      # The advisory database is deliberately NOT cached: a stale advisory DB is a
      # green build that means nothing.
      - name: cargo audit
        # cargo-audit reads Cargo.lock, which lists packages that are never
        # compiled — including drivers behind features we do not enable. Each
        # --ignore below therefore states the advisory, why we are not exposed,
        # what removes the ignore, and when to look again. Nothing is ignored
        # because it is inconvenient.
        #
        # RUSTSEC-2023-0071 (rsa, Marvin timing side-channel, no fix available):
        #   rsa is pulled by sqlx-mysql. We use PostgreSQL only; `cargo tree -i
        #   rsa` returns nothing, so no rsa code is in any binary we ship, and
        #   cargo-deny (which walks the built graph rather than the lockfile)
        #   reports clean. It disappears from the lockfile entirely once sqlx is
        #   declared with `default-features = false` in the root manifest —
        #   remove this ignore in the same commit. Revisit 2026-11-18.
        run: # Suppressions live in audit.toml, where each carries its reason and its expiry
          # condition. --deny warnings keeps unsoundness advisories blocking, not advisory.
          cargo audit --deny warnings

  deny:
    name: cargo deny — advisories, licences, bans, sources
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install the pinned toolchain
        run: |
          set -euo pipefail
          channel=$(grep -E '^[[:space:]]*channel' rust-toolchain.toml | head -1 | sed -E 's/.*"(.*)".*/\1/')
          rustup toolchain install "$channel" --profile minimal --no-self-update
          rustup default "$channel"
          rustc --version

      - name: Cache cargo-deny binary
        id: deny-cache
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/cargo-deny
          key: ${{ runner.os }}-cargo-deny-${{ env.TOOL_CACHE_EPOCH }}-${{ hashFiles('rust-toolchain.toml') }}

      # Retried: installing the tool is a registry download, not a verdict.
      - name: Install cargo-deny
        if: steps.deny-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4; do
            if cargo install --locked cargo-deny; then
              echo "cargo-deny installed on attempt ${attempt}"
              exit 0
            fi
            if [ "$attempt" -lt 4 ]; then
              delay=$((attempt * attempt * 5))
              echo "crates.io fetch failed (attempt ${attempt}/4); retrying in ${delay}s"
              sleep "$delay"
            fi
          done
          echo "::error title=Dependency registry unavailable — NOT a policy violation::cargo could not install cargo-deny from index.crates.io after 4 attempts over ~70s. No check ran: no advisory, licence or source was rejected, and none was cleared. Check https://status.crates.io and re-run the job."
          exit 1

      # The graph cargo-deny is about to judge, fetched separately so that a
      # registry outage cannot be reported as a licence or advisory finding.
      - name: Fetch dependencies (retried — registry only)
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4; do
            if cargo fetch --locked; then
              echo "dependencies fetched on attempt ${attempt}"
              exit 0
            fi
            if [ "$attempt" -lt 4 ]; then
              delay=$((attempt * attempt * 5))
              echo "crates.io fetch failed (attempt ${attempt}/4); retrying in ${delay}s"
              sleep "$delay"
            fi
          done
          echo "::error title=Dependency registry unavailable — NOT a policy violation::cargo could not fetch from index.crates.io after 4 attempts over ~70s. No check ran: nothing was rejected and nothing was cleared. Check https://status.crates.io and re-run the job."
          exit 1

      # Policy lives in deny.toml at the repository root, reviewed like code.
      # `bans` is warn-only for duplicate versions (see deny.toml) so it reports
      # without blocking; advisories, licences and sources block.
      - name: cargo deny check
        run: cargo deny --workspace check --show-stats

  sbom:
    name: SBOM — CycloneDX inventory of the dependency graph
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install the pinned toolchain
        run: |
          set -euo pipefail
          channel=$(grep -E '^[[:space:]]*channel' rust-toolchain.toml | head -1 | sed -E 's/.*"(.*)".*/\1/')
          rustup toolchain install "$channel" --profile minimal --no-self-update
          rustup default "$channel"
          rustc --version

      - name: Cache cargo-cyclonedx binary
        id: cyclonedx-cache
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/cargo-cyclonedx
          key: ${{ runner.os }}-cargo-cyclonedx-${{ env.TOOL_CACHE_EPOCH }}-${{ hashFiles('rust-toolchain.toml') }}

      # Retried: installing the tool is a registry download, not a verdict.
      - name: Install cargo-cyclonedx
        if: steps.cyclonedx-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4; do
            if cargo install --locked cargo-cyclonedx; then
              echo "cargo-cyclonedx installed on attempt ${attempt}"
              exit 0
            fi
            if [ "$attempt" -lt 4 ]; then
              delay=$((attempt * attempt * 5))
              echo "crates.io fetch failed (attempt ${attempt}/4); retrying in ${delay}s"
              sleep "$delay"
            fi
          done
          echo "::error title=Dependency registry unavailable — NOT an SBOM failure::cargo could not install cargo-cyclonedx from index.crates.io after 4 attempts over ~70s. No inventory was produced and none was found wanting. Check https://status.crates.io and re-run the job."
          exit 1

      # The graph the inventory describes, fetched separately: an SBOM job that
      # dies on a 503 must not read as "the dependency graph could not be
      # inventoried", which is a supply-chain sentence.
      - name: Fetch dependencies (retried — registry only)
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4; do
            if cargo fetch --locked; then
              echo "dependencies fetched on attempt ${attempt}"
              exit 0
            fi
            if [ "$attempt" -lt 4 ]; then
              delay=$((attempt * attempt * 5))
              echo "crates.io fetch failed (attempt ${attempt}/4); retrying in ${delay}s"
              sleep "$delay"
            fi
          done
          echo "::error title=Dependency registry unavailable — NOT an SBOM failure::cargo could not fetch from index.crates.io after 4 attempts over ~70s. No inventory was produced. Check https://status.crates.io and re-run the job."
          exit 1

      # An SBOM is what lets an operator answer "are we affected?" on the day an
      # advisory lands, without rebuilding the tree. Enterprise buyers ask for it.
      - name: Generate SBOM
        run: |
          set -euo pipefail
          mkdir -p sbom
          # cargo-cyclonedx writes <crate>.cdx.json beside each manifest; it has no
          # output-directory flag, so collect afterwards rather than assuming one.
          cargo cyclonedx --all --format json
          find . -name '*.cdx.json' -not -path './sbom/*' -print -exec mv {} sbom/ \;
          ls -la sbom
          test -n "$(ls -A sbom)" || { echo "::error::SBOM generation produced no files"; exit 1; }

      - name: Upload SBOM
        uses: actions/upload-artifact@v7
        with:
          name: sbom-cyclonedx-${{ github.sha }}
          path: sbom/
          if-no-files-found: error
          retention-days: 90

  # A weekly run that fails must produce something a human sees. A red scheduled
  # workflow with nobody watching is the same as no workflow at all.
  report-scheduled-failure:
    name: Raise a P0 for a failed scheduled scan
    if: failure() && github.event_name == 'schedule'
    needs: [audit, deny, sbom]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open a tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title="P0: scheduled dependency scan failed ($(date -u +%Y-%m-%d))"
          body="The weekly \`Security\` workflow failed with no code change: a dependency has become vulnerable, yanked, or licence-noncompliant.

          Run: $RUN_URL

          **First, read which step failed.** If the failing job stopped in an \`Install …\` or \`Fetch dependencies\` step, its annotation says the registry was unavailable and nothing was audited — that is an infrastructure re-run, not an advisory, and this issue should be closed saying so. Anything else is a real finding.

          Per TRACKER.md §1 this is an automatic P0. Add a tracker row, triage the advisory, and either upgrade or record an explicit, dated exception in \`deny.toml\`."
          # The label may not exist yet in a fresh repository; never let labelling
          # be the reason the alert does not get filed.
          gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body" --label security \
            || gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
