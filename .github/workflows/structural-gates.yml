# Structural gates — assertions about the codebase itself, not its behaviour.
# Source of truth for the list: docs/12-TESTING.md §5. One job per gate, on
# purpose: when a gate breaks the red check must read "no raw pool" or
# "RLS coverage", not "tests failed". A developer should know which rule they
# broke from the check name alone, before opening a single log.
#
# Gates that need a migrated database (RLS coverage, composite FKs) and gates
# that need code that does not exist yet (policy routing, OpenAPI, the web app)
# are written HERE AND NOW, in their final form, and report PENDING loudly until
# their dependency lands. They never silently succeed: a pending gate emits a
# warning annotation and a step-summary row, so "green" and "not yet enforced"
# can be told apart at a glance.
#
# ---------------------------------------------------------------------------
# Why every cargo job here fetches in its own step
#
# Each job in this file is named after a rule, which is the point — the check
# name tells you what you broke before you open a log. That naming is also what
# makes a registry outage actively harmful: on 2026-08-20 `index.crates.io`
# returned 503, and the failure arrived as
#
#     RULE: every tenant_id table is granted to enclave_app, which cannot bypass RLS
#
# for a CDN having a bad minute. A gate whose red state can mean "infrastructure"
# but says "security" is one people learn to re-run rather than read, and the run
# that gets waved through as "probably flaky" is eventually the real finding.
#
# So the fetch is its own step, with a bounded retry, and it says "registry" when
# it gives up. `cargo fetch --locked` is the only crates.io traffic in these jobs;
# after it succeeds the assertion command resolves from Cargo.lock and the local
# cache and touches no network. A registry outage therefore fails in a step that
# names the registry, and the rule below it either runs properly or does not run.
#
# THE RETRY COVERS THE FETCH AND NOTHING ELSE. Retrying an assertion is how an
# intermittent security failure becomes a green build: three attempts at "no FK
# omits tenant_id" passes on the run where one did. Fetching has no verdict and
# is idempotent; a gate has a verdict and gets exactly one attempt, always.
# ---------------------------------------------------------------------------
name: Structural gates

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: structural-gates-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  # --------------------------------------------------------------------------
  # Gate: RLS coverage — needs a migrated database (ENC-105 + ENC-106).
  # --------------------------------------------------------------------------
  rls-coverage:
    name: "RULE: every tenant_id table has RLS enabled, forced, and a policy"
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: enclave
          POSTGRES_PASSWORD: enclave
          POSTGRES_DB: enclave
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U enclave"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://enclave:enclave@localhost:5432/enclave
    steps:
      - uses: actions/checkout@v7

      - name: Install the pinned toolchain
        run: |
          set -euo pipefail
          channel=$(grep -E '^[[:space:]]*channel' rust-toolchain.toml | head -1 | sed -E 's/.*"(.*)".*/\1/')
          rustup toolchain install "$channel" --profile minimal --no-self-update
          rustup default "$channel"
          rustc --version

      # Fetch only — never the gate below. See the header comment.
      - name: Fetch dependencies (retried — registry only)
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4; do
            if cargo fetch --locked; then
              echo "dependencies fetched on attempt ${attempt}"
              exit 0
            fi
            if [ "$attempt" -lt 4 ]; then
              delay=$((attempt * attempt * 5))
              echo "crates.io fetch failed (attempt ${attempt}/4); retrying in ${delay}s"
              sleep "$delay"
            fi
          done
          echo "::error title=Dependency registry unavailable — NOT a gate failure::cargo could not fetch from index.crates.io after 4 attempts over ~70s. The RLS coverage gate did not run: nothing was asserted and no rule was broken. Check https://status.crates.io and re-run the job."
          exit 1

      # The gate is a Rust integration test (ENC-106) rather than a shell script
      # so the same command proves the same rule locally and in CI.
      - name: Enumerate information_schema and assert RLS
        run: |
          set -euo pipefail
          RULE='RLS coverage — every table with a tenant_id column has rowsecurity AND forcerowsecurity AND at least one policy (docs/12-TESTING.md §5, CLAUDE.md rule 4)'
          GATE_TEST=crates/db/tests/rls_coverage.rs
          # ENC-543: this branch used to warn and `exit 0` when the test was missing, so the
          # check reported **pass**, in green, while inspecting nothing. That is how a rule
          # CLAUDE.md calls non-negotiable went a milestone unenforced, and how three
          # single-column foreign keys in the auth tables survived review. The test exists
          # now, so its absence is a failure: deleting it must break the build rather than
          # quietly disarming the gate.
          if [ ! -f "$GATE_TEST" ]; then
            echo "::error title=GATE MISSING: RLS coverage::${RULE} — ${GATE_TEST} does not exist. A gate whose test is absent must fail, never pass (ENC-543). If it was deliberately removed, remove the job in the same commit and say why."
            exit 1
          fi
          echo "Enforcing: ${RULE}"
          cargo test -p enclave-db --locked --test rls_coverage -- --include-ignored --nocapture

  # --------------------------------------------------------------------------
  # Gate: grant coverage — the other half of the RLS gate above (ENC-127a).
  #
  # RLS coverage proves the policies are on. It cannot prove the role those
  # policies constrain can reach the table at all, and a table nobody can query
  # passes it trivially. That gap is ENC-124: every tenant-scoped table except
  # audit_events was protected and ungranted, so nothing ever connected as
  # enclave_app, everything ran as superuser, and superusers bypass RLS. The
  # policies were correct the whole time and had never once been applied.
  #
  # Its own postgres service rather than sharing one with rls-coverage: this job
  # temporarily reasons about role attributes and grants, and two gates mutating
  # one database would make a failure in either unattributable.
  # --------------------------------------------------------------------------
  grant-coverage:
    name: "RULE: every tenant_id table is granted to enclave_app, which cannot bypass RLS"
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: enclave
          POSTGRES_PASSWORD: enclave
          POSTGRES_DB: enclave
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U enclave"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://enclave:enclave@localhost:5432/enclave
    steps:
      - uses: actions/checkout@v7

      - name: Install the pinned toolchain
        run: |
          set -euo pipefail
          channel=$(grep -E '^[[:space:]]*channel' rust-toolchain.toml | head -1 | sed -E 's/.*"(.*)".*/\1/')
          rustup toolchain install "$channel" --profile minimal --no-self-update
          rustup default "$channel"
          rustc --version

      # Fetch only — never the gate below. See the header comment: this job's name
      # is the sentence that appeared on main for a crates.io 503.
      - name: Fetch dependencies (retried — registry only)
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4; do
            if cargo fetch --locked; then
              echo "dependencies fetched on attempt ${attempt}"
              exit 0
            fi
            if [ "$attempt" -lt 4 ]; then
              delay=$((attempt * attempt * 5))
              echo "crates.io fetch failed (attempt ${attempt}/4); retrying in ${delay}s"
              sleep "$delay"
            fi
          done
          echo "::error title=Dependency registry unavailable — NOT a gate failure::cargo could not fetch from index.crates.io after 4 attempts over ~70s. The grant coverage gate did not run: nothing was asserted and no rule was broken. Check https://status.crates.io and re-run the job."
          exit 1

      # A Rust integration test rather than a shell script, for the same reason
      # as rls-coverage: one command proves the rule locally and in CI.
      - name: Assert the application role can reach what RLS protects
        id: gate
        run: |
          set -euo pipefail
          RULE='Grant coverage — every table with a tenant_id column grants enclave_app at least SELECT; audit_events and its partitions grant SELECT and INSERT and not UPDATE/DELETE/TRUNCATE; enclave_app is neither SUPERUSER nor BYPASSRLS and may SET app.tenant_id (docs/12-TESTING.md §5, CLAUDE.md rule 4, ENC-124)'
          GATE_TEST=crates/db/tests/grant_coverage.rs
          if [ ! -f "$GATE_TEST" ]; then
            echo "::error title=GATE FAILED: grant coverage::${RULE} — ${GATE_TEST} is missing. It landed with ENC-127a; a deleted gate is a silent green, not a pass."
            exit 1
          fi
          echo "Enforcing: ${RULE}"
          cargo test -p enclave-db --locked --test grant_coverage -- --include-ignored --nocapture

      # Conditioned on the gate step, not on the job: a failed dependency fetch
      # must not print a page explaining which security rule was broken, because
      # none was. That page is the thing a reader remembers.
      - name: Explain on failure
        if: failure() && steps.gate.outcome == 'failure'
        run: |
          set -euo pipefail
          {
            echo "### ❌ FAILED — Grant coverage"
            echo ""
            echo "**Rule:** every tenant-scoped table is *usable* by \`enclave_app\`, and that role"
            echo "cannot escape the policies that constrain it (CLAUDE.md rule 4, docs/04-DATA-MODEL.md §3)."
            echo ""
            echo "The failing assertion above names the table or the role attribute. The four things"
            echo "this gate asserts, and what a failure in each means:"
            echo ""
            echo "- **No \`SELECT\` on a tenant-scoped table** — the table is protected but unreachable."
            echo "  Nothing will ever query it as \`enclave_app\`, so its RLS policy is never exercised."
            echo "  Grant the DML in the same migration that creates the table."
            echo "- **An audit partition holds \`UPDATE\`/\`DELETE\`/\`TRUNCATE\`** — the trail is no longer"
            echo "  append-only and the hash chain can be recomputed to match a rewrite (docs/12 §4.9, U2)."
            echo "- **\`enclave_app\` is \`SUPERUSER\` or \`BYPASSRLS\`** — every policy in the schema is"
            echo "  decorative. RLS coverage stays green while isolation is off. This is ENC-124."
            echo "- **\`enclave_app\` cannot \`SET app.tenant_id\`** — every tenant-scoped query fails or"
            echo "  returns nothing, which reads as an empty database rather than a broken grant."
            echo ""
            echo "Run it locally against a dev database:"
            echo "\`DATABASE_URL=… cargo test -p enclave-db --test grant_coverage -- --include-ignored\`."
          } >> "$GITHUB_STEP_SUMMARY"

  # --------------------------------------------------------------------------
  # Gate: composite foreign keys — same dependency, different rule.
  # --------------------------------------------------------------------------
  composite-fks:
    name: "RULE: every FK between tenant-scoped tables includes tenant_id"
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: enclave
          POSTGRES_PASSWORD: enclave
          POSTGRES_DB: enclave
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U enclave"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://enclave:enclave@localhost:5432/enclave
    steps:
      - uses: actions/checkout@v7

      - name: Install the pinned toolchain
        run: |
          set -euo pipefail
          channel=$(grep -E '^[[:space:]]*channel' rust-toolchain.toml | head -1 | sed -E 's/.*"(.*)".*/\1/')
          rustup toolchain install "$channel" --profile minimal --no-self-update
          rustup default "$channel"
          rustc --version

      # Fetch only — never the gate below. Skipped while the gate is PENDING: a
      # registry outage failing a gate that is not enforced yet would be the same
      # mis-attribution twice over.
      - name: Fetch dependencies (retried — registry only)
        if: hashFiles('crates/db/tests/composite_fk_coverage.rs') != ''
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4; do
            if cargo fetch --locked; then
              echo "dependencies fetched on attempt ${attempt}"
              exit 0
            fi
            if [ "$attempt" -lt 4 ]; then
              delay=$((attempt * attempt * 5))
              echo "crates.io fetch failed (attempt ${attempt}/4); retrying in ${delay}s"
              sleep "$delay"
            fi
          done
          echo "::error title=Dependency registry unavailable — NOT a gate failure::cargo could not fetch from index.crates.io after 4 attempts over ~70s. The composite FK gate did not run: nothing was asserted and no rule was broken. Check https://status.crates.io and re-run the job."
          exit 1

      # A single-column FK to a tenant-scoped parent lets a child row point at a
      # parent in another tenant. RLS does not catch it; the constraint must.
      - name: Assert composite foreign keys
        run: |
          set -euo pipefail
          RULE='Composite FKs — every foreign key between tenant-scoped tables carries tenant_id in the constraint (docs/12-TESTING.md §5, CLAUDE.md rule 4)'
          GATE_TEST=crates/db/tests/composite_fk_coverage.rs
          # ENC-543: this branch used to warn and `exit 0` when the test was missing, so the
          # check reported **pass**, in green, while inspecting nothing. That is how a rule
          # CLAUDE.md calls non-negotiable went a milestone unenforced, and how three
          # single-column foreign keys in the auth tables survived review. The test exists
          # now, so its absence is a failure: deleting it must break the build rather than
          # quietly disarming the gate.
          if [ ! -f "$GATE_TEST" ]; then
            echo "::error title=GATE MISSING: Composite FKs::${RULE} — ${GATE_TEST} does not exist. A gate whose test is absent must fail, never pass (ENC-543). If it was deliberately removed, remove the job in the same commit and say why."
            exit 1
          fi
          echo "Enforcing: ${RULE}"
          cargo test -p enclave-db --locked --test composite_fk_coverage -- --include-ignored --nocapture

  # --------------------------------------------------------------------------
  # Gate: policy routing — the ENC-110 xtask call-graph lint.
  # --------------------------------------------------------------------------
  policy-routing:
    name: "RULE: every route handler reaches PolicyEngine::enforce"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install the pinned toolchain
        run: |
          set -euo pipefail
          channel=$(grep -E '^[[:space:]]*channel' rust-toolchain.toml | head -1 | sed -E 's/.*"(.*)".*/\1/')
          rustup toolchain install "$channel" --profile minimal --no-self-update
          rustup default "$channel"
          rustc --version

      # Fetch only — never the lint below. See the header comment.
      - name: Fetch dependencies (retried — registry only)
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4; do
            if cargo fetch --locked; then
              echo "dependencies fetched on attempt ${attempt}"
              exit 0
            fi
            if [ "$attempt" -lt 4 ]; then
              delay=$((attempt * attempt * 5))
              echo "crates.io fetch failed (attempt ${attempt}/4); retrying in ${delay}s"
              sleep "$delay"
            fi
          done
          echo "::error title=Dependency registry unavailable — NOT a gate failure::cargo could not fetch from index.crates.io after 4 attempts over ~70s. The policy-routing lint did not run: no handler was checked and no rule was broken. Check https://status.crates.io and re-run the job."
          exit 1

      # Enforced since ENC-110. The lint prints its allowlist on every run, so every exemption
      # from the policy chain appears in the log of every pull request rather than only in source.
      - name: Walk the api crate's route registrations
        id: gate
        run: |
          set -euo pipefail
          RULE='Policy routing — every Axum route handler reaches PolicyEngine::enforce; exemptions live in an allowlist with a written reason (docs/12-TESTING.md §5, CLAUDE.md rule 1)'
          echo "Enforcing: ${RULE}"
          cargo run --locked -p xtask -- policy-routing

      # Conditioned on the lint step, not the job: a failed fetch must not print a
      # page about handlers that bypass the policy chain when none were examined.
      - name: Explain on failure
        if: failure() && steps.gate.outcome == 'failure'
        run: |
          set -euo pipefail
          {
            echo "### ❌ FAILED — Policy routing"
            echo ""
            echo "**Rule:** Every Axum route handler reaches \`PolicyEngine::enforce\`"
            echo "(docs/12-TESTING.md §5, CLAUDE.md rule 1)."
            echo ""
            echo "A route was registered whose handler has no reachable call to the policy engine."
            echo "The annotations above name the handler and the line. Either call"
            echo "\`PolicyEngine::enforce\` before touching tenant data, or — if the endpoint"
            echo "genuinely has no policy decision to make — add it to \`ALLOWLIST\` in"
            echo "\`xtask/src/policy_routing.rs\` **with the reason**, which is printed on every run"
            echo "and is the review surface for exemptions."
            echo ""
            echo "Run it locally with \`cargo run -p xtask -- policy-routing\`."
          } >> "$GITHUB_STEP_SUMMARY"

  # --------------------------------------------------------------------------
  # Gate: no raw pool — enforceable today, purely static.
  # --------------------------------------------------------------------------
  no-raw-pool:
    name: 'RULE: no sqlx query outside the db crate bypasses TenantScoped'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: No database access bypasses TenantScoped
        run: python3 .github/scripts/no_raw_pool.py
      - name: Explain on failure
        if: failure()
        run: |
          {
            echo "### FAILED - No raw pool"
            echo ""
            echo "A query ran against a pool rather than a \`TenantScoped\` transaction, or a"
            echo "compile-time \`sqlx::query!\` macro appeared outside the db crate."
            echo ""
            echo "A pooled connection has no \`app.tenant_id\`, so under FORCE ROW LEVEL SECURITY"
            echo "the query either fails or silently returns nothing. Open a \`TenantScoped\`"
            echo "transaction and run the query on that."
            echo ""
            echo "If this is genuinely one of the cross-tenant platform paths, add it to \`ALLOW\`"
            echo "in \`.github/scripts/no_raw_pool.py\` **with the reason**, in a commit a reviewer"
            echo "will see."
          } >> "$GITHUB_STEP_SUMMARY"
  # --------------------------------------------------------------------------
  # Gate: the tracker's rollup agrees with its rows. Static, and cheap.
  # --------------------------------------------------------------------------
  tracker-rollup:
    name: 'RULE: the tracker rollup agrees with its rows'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: The rollup counts what the rows say
        run: python3 .github/scripts/tracker_rollup.py
      - name: Explain on failure
        if: failure()
        run: |
          {
            echo "### FAILED - Tracker rollup"
            echo ""
            echo "\`TRACKER.md §5\` disagrees with the rows in \`§3\` and \`§4\`."
            echo ""
            echo "\`CLAUDE.md\` asks for the row, the rollup and the log in the **same edit**."
            echo "This is the part that gets forgotten, because the rows are the work and the"
            echo "table is admin afterwards. It has drifted three times: once reading"
            echo "\"Phase 1: 0 done\" while twenty-four of its rows were merged, once nine rows"
            echo "behind, and once by six P1s because increments were applied to a base that was"
            echo "already stale."
            echo ""
            echo "Each time it was caught by somebody reading carefully, which is not a control."
            echo "A rollup nobody can trust is worse than no rollup, because a planning decision"
            echo "gets made from it."
            echo ""
            echo "Fix it with:"
            echo ""
            echo "    python3 .github/scripts/tracker_rollup.py --fix"
          } >> "$GITHUB_STEP_SUMMARY"

  obligations:
    name: "RULE: PolicyDecision is must_use and never discarded"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Two halves. (a) The attribute still exists — someone removing #[must_use]
      # would turn every other check in the workspace into a no-op, and clippy
      # would report nothing at all. (b) No call site launders the decision
      # through `let _ =`, which suppresses must_use by design.
      - name: Assert must_use survives, and nothing discards a decision
        run: |
          set -euo pipefail
          # shellcheck disable=SC2016  # ${...} and backticks below are prose, not expansions
          RULE='Obligations — PolicyDecision and Obligations are #[must_use] and no call site discards them with `let _ =` (docs/12-TESTING.md §5, CLAUDE.md rule 8)'
          echo "Enforcing: ${RULE}"
          failed=0

          policy_rs=crates/core/src/policy.rs
          if [ ! -f "$policy_rs" ]; then
            echo "::error title=GATE FAILED: obligations::${policy_rs} is missing — PolicyDecision must be defined in enclave-core."
            exit 1
          fi
          for ty in PolicyDecision Obligations; do
            if ! grep -B4 -E "pub struct ${ty}\b" "$policy_rs" | grep -q 'must_use'; then
              echo "::error file=${policy_rs},title=GATE FAILED: obligations::${RULE} — ${ty} has lost its #[must_use] attribute."
              failed=1
            fi
          done

          # Comment lines are excluded: docs and doc-examples legitimately show
          # the forbidden form in order to name it as forbidden.
          discards=$(grep -rnE 'let[[:space:]]+_[[:space:]]*(:[^=]+)?=[^;]*\b(enforce|PolicyDecision|Obligations|allow_unconditional)\b' \
                       --include='*.rs' crates \
                     | grep -vE '^[^:]+:[0-9]+:[[:space:]]*(//|/\*|\*)' || true)
          if [ -n "$discards" ]; then
            echo "$discards"
            while IFS= read -r line; do
              file=${line%%:*}; rest=${line#*:}; lno=${rest%%:*}
              echo "::error file=${file},line=${lno},title=GATE FAILED: obligations::${RULE} — a policy decision is being discarded."
            done <<< "$discards"
            failed=1
          fi

          if [ "$failed" -ne 0 ]; then
            {
              echo "### ❌ FAILED — Obligations"
              echo ""
              echo "**Rule:** ${RULE}"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "must_use intact; no discarded decisions."

  # --------------------------------------------------------------------------
  # Gate: secrets — references only, never literals.
  # --------------------------------------------------------------------------
  secrets:
    name: "RULE: no literal credentials in config, fixtures or code"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Deliberately self-contained rather than a third-party scanner: this gate
      # must keep working on a fork with no network egress and no marketplace
      # trust decision, and its rule set has to be readable in review.
      # `vault://`, `env://`, `file://` and `${...}` interpolation are the only
      # legal right-hand sides (CLAUDE.md rule 11, docs/08-BYO-INFRA.md §19).
      - name: Scan for credential literals
        run: |
          set -euo pipefail
          # shellcheck disable=SC2016  # ${VAR} below is prose, not an expansion
          RULE='Secrets — credentials are references (vault://, env://, ${VAR}), never literals, in configuration, fixtures or code (docs/12-TESTING.md §5, CLAUDE.md rule 11)'
          echo "Enforcing: ${RULE}"
          failed=0

          # Private key material, in any file, is never acceptable — not even a
          # throwaway dev key (plans/M0-FOUNDATIONS.md D5).
          keys=$(grep -rlE --exclude-dir=.git --exclude-dir=target --exclude-dir=node_modules \
                   -e '-----BEGIN [A-Z ]*PRIVATE KEY-----' . || true)
          if [ -n "$keys" ]; then
            for f in $keys; do
              echo "::error file=${f},title=GATE FAILED: secrets::${RULE} — this file contains private key material."
            done
            failed=1
          fi

          # Cloud provider long-lived credentials.
          cloud=$(grep -rnE --exclude-dir=.git --exclude-dir=target --exclude-dir=node_modules \
                    --exclude-dir=.github --exclude='*.lock' \
                    -e '\bAKIA[0-9A-Z]{16}\b' -e '\bASIA[0-9A-Z]{16}\b' \
                    -e '\bghp_[A-Za-z0-9]{36}\b' -e '\bxox[baprs]-[A-Za-z0-9-]{10,}' . || true)
          if [ -n "$cloud" ]; then
            echo "$cloud"
            echo "::error title=GATE FAILED: secrets::${RULE} — a provider access key or token literal is committed. Rotate it, then remove it."
            failed=1
          fi

          # Inline credential assignments in configuration and fixtures.
          cfg=$(find deploy tests fixtures crates -type f \
                  \( -name '*.yaml' -o -name '*.yml' -o -name '*.json' -o -name '*.toml' -o -name '*.env' \) \
                  -not -name 'Cargo.toml' -not -name 'Cargo.lock' 2>/dev/null || true)
          if [ -n "$cfg" ]; then
            # shellcheck disable=SC2086  # $cfg is a file list; splitting is the point
            inline=$(grep -nHiE '(password|passwd|secret|client_secret|api_?key|access_?token|private_?key)[[:space:]]*[:=][[:space:]]*"?[^"[:space:]]+' $cfg \
                     | grep -viE '(vault|env|file|aws-secrets|gcp-secrets|azure-keyvault)://' \
                     | grep -vE '\$\{' \
                     | grep -viE '[:=][[:space:]]*"?(null|~|""|<[^>]*>|CHANGE_?ME|REPLACE_?ME|example|placeholder|true|false)"?[[:space:]]*$' || true)
            if [ -n "$inline" ]; then
              echo "$inline"
              while IFS= read -r line; do
                file=${line%%:*}; rest=${line#*:}; lno=${rest%%:*}
                echo "::error file=${file},line=${lno},title=GATE FAILED: secrets::${RULE} — inline credential; use a vault:// or env:// reference."
              done <<< "$inline"
              failed=1
            fi
          fi

          if [ "$failed" -ne 0 ]; then
            {
              echo "### ❌ FAILED — Secrets"
              echo ""
              echo "**Rule:** ${RULE}"
              echo ""
              echo "Rotate anything that was committed. Removing it from the tree does not un-leak it."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "No credential literals found."

  # --------------------------------------------------------------------------
  # Gate: migrations — numbered, gapless, forward-only.
  # --------------------------------------------------------------------------
  migrations:
    name: "RULE: migrations are numbered, gapless and forward-only"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Needs history: the forward-only check compares against the base ref.
          fetch-depth: 0

      - name: Assert numbering, and that no applied migration was edited
        run: |
          set -euo pipefail
          RULE='Migrations — numbered NNNN_name.sql, no gaps, no duplicate numbers, forward-only: an already-merged migration is never edited (docs/12-TESTING.md §5, CLAUDE.md SQL conventions)'
          echo "Enforcing: ${RULE}"
          failed=0

          if [ ! -d migrations ]; then
            echo "::error title=GATE FAILED: migrations::migrations/ does not exist."
            exit 1
          fi

          expected=1
          for f in $(find migrations -maxdepth 1 -name '*.sql' | sort); do
            base=$(basename "$f")
            if ! echo "$base" | grep -qE '^[0-9]{4}_[a-z0-9_]+\.sql$'; then
              echo "::error file=${f},title=GATE FAILED: migrations::${RULE} — '${base}' is not NNNN_snake_case_name.sql."
              failed=1
              continue
            fi
            n=$(echo "$base" | cut -c1-4 | sed 's/^0*//')
            n=${n:-0}
            if [ "$n" -ne "$expected" ]; then
              echo "::error file=${f},title=GATE FAILED: migrations::${RULE} — expected migration $(printf '%04d' "$expected"), found '${base}'. Gaps and duplicates break checksum ordering."
              failed=1
            fi
            expected=$((n + 1))
          done

          # Forward-only: on a PR, a migration that already exists on the base
          # branch must be byte-identical. Editing one silently diverges every
          # database that already applied it.
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            base_sha=$(git merge-base "origin/${GITHUB_BASE_REF}" HEAD 2>/dev/null || true)
            if [ -n "$base_sha" ]; then
              changed=$(git diff --name-only --diff-filter=MD "$base_sha" HEAD -- migrations/ || true)
              if [ -n "$changed" ]; then
                for f in $changed; do
                  echo "::error file=${f},title=GATE FAILED: migrations::${RULE} — this migration already exists on ${GITHUB_BASE_REF} and was modified or deleted. Add a new migration instead."
                done
                failed=1
              fi
            else
              echo "::warning title=migrations::Could not resolve the merge base; the forward-only half of this gate did not run."
            fi
          fi

          # Contract-phase DDL is legal but must be deliberate, so it is surfaced
          # for review rather than blocked (expand-then-contract across releases).
          contract=$(grep -rniE '^[[:space:]]*(alter table[^;]*drop (column|constraint)|drop (table|column|type|index))' migrations/*.sql || true)
          if [ -n "$contract" ]; then
            echo "$contract"
            echo "::warning title=Contract-phase migration::Destructive DDL detected. Confirm the expand phase shipped in a previous release and that no running version reads the dropped object."
          fi

          if [ "$failed" -ne 0 ]; then
            {
              echo "### ❌ FAILED — Migrations"
              echo ""
              echo "**Rule:** ${RULE}"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "Migration numbering and immutability hold."

  # --------------------------------------------------------------------------
  # Gate: dependencies — the work happens in security.yml; this asserts the
  # gate itself still exists, because a deleted workflow is a silent green.
  # --------------------------------------------------------------------------
  dependencies:
    name: "RULE: cargo audit, cargo deny and SBOM stay wired up"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Assert the supply-chain workflow and policy are present
        run: |
          set -euo pipefail
          RULE='Dependencies — cargo audit and cargo deny run on PRs and on a schedule, and an SBOM is produced (docs/12-TESTING.md §5)'
          echo "Enforcing: ${RULE}"
          failed=0
          wf=.github/workflows/security.yml
          for path in "$wf" deny.toml; do
            if [ ! -f "$path" ]; then
              echo "::error title=GATE FAILED: dependencies::${RULE} — ${path} is missing."
              failed=1
            fi
          done
          if [ -f "$wf" ]; then
            for needle in 'cargo audit' 'cargo deny' 'cyclonedx' 'schedule:'; do
              if ! grep -q "$needle" "$wf"; then
                echo "::error file=${wf},title=GATE FAILED: dependencies::${RULE} — '${needle}' no longer appears in the security workflow."
                failed=1
              fi
            done
          fi
          [ "$failed" -eq 0 ] || exit 1
          echo "Supply-chain gate intact. Its verdict is in the Security workflow."

  # --------------------------------------------------------------------------
  # Gate: API contract — pending until the api crate can emit a spec.
  # --------------------------------------------------------------------------
  api-contract:
    name: "RULE: generated OpenAPI matches the committed snapshot"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Fetch only — never the diff below. Skipped while the gate is PENDING, for
      # the same reason as composite-fks.
      - name: Fetch dependencies (retried — registry only)
        if: hashFiles('docs/api/openapi.yaml') != ''
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4; do
            if cargo fetch --locked; then
              echo "dependencies fetched on attempt ${attempt}"
              exit 0
            fi
            if [ "$attempt" -lt 4 ]; then
              delay=$((attempt * attempt * 5))
              echo "crates.io fetch failed (attempt ${attempt}/4); retrying in ${delay}s"
              sleep "$delay"
            fi
          done
          echo "::error title=Dependency registry unavailable — NOT a gate failure::cargo could not fetch from index.crates.io after 4 attempts over ~70s. The API contract gate did not run: no spec was generated and no drift was found. Check https://status.crates.io and re-run the job."
          exit 1

      - name: Regenerate the spec and diff it against the snapshot
        run: |
          set -euo pipefail
          RULE='API contract — the generated OpenAPI document matches docs/api/openapi.yaml, or the diff is explicitly approved (docs/12-TESTING.md §5, docs/05-API.md)'
          SNAPSHOT=docs/api/openapi.yaml
          if [ ! -f "$SNAPSHOT" ]; then
            echo "::warning title=GATE PENDING: API contract::${RULE} — NOT ENFORCED YET. ${SNAPSHOT} does not exist; it lands with the first API surface (M1). This gate is pending, not passing."
            {
              echo "### ⏳ PENDING — API contract"
              echo ""
              echo "**Rule:** ${RULE}"
              echo ""
              echo "Not enforced yet: \`${SNAPSHOT}\` is missing (lands with the first API surface, **M1**)."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "Enforcing: ${RULE}"
          cargo run --locked -p enclave-api --bin openapi -- --output /tmp/openapi.yaml
          if ! diff -u "$SNAPSHOT" /tmp/openapi.yaml; then
            echo "::error file=${SNAPSHOT},title=GATE FAILED: API contract::${RULE} — the generated spec differs from the snapshot. Commit the regenerated file in the same PR as the change that caused it."
            exit 1
          fi

  # --------------------------------------------------------------------------
  # Web gates — pending until web/ exists. Grouped in one job because they share
  # a single dependency and a single "does web/ exist" answer; each still names
  # its own rule in its own step.
  # --------------------------------------------------------------------------
  web-gates:
    name: "RULE: i18n catalog, bundle budget and axe pass on web/"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Detect the web workspace
        id: detect
        run: |
          set -euo pipefail
          if [ -f web/package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: PENDING notice
        if: steps.detect.outputs.present != 'true'
        run: |
          set -euo pipefail
          {
            echo "### ⏳ PENDING — web structural gates"
            echo ""
            echo "\`web/\` does not exist yet (frontend lands in **M6**). Not enforced:"
            echo ""
            echo "- **i18n** — no untranslated user-facing string literals in \`web/src\` (docs/14-I18N-L10N.md §8)"
            echo "- **Bundle size** — main bundle ≤ 250 KB gzipped (docs/12-TESTING.md §5)"
            echo "- **Accessibility** — axe passes on every primary route"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::warning title=GATE PENDING: web structural gates::i18n, bundle size and accessibility are NOT ENFORCED — web/ does not exist yet (M6). Pending, not passing."

      - name: Set up Node
        if: steps.detect.outputs.present == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        if: steps.detect.outputs.present == 'true'
        working-directory: web
        run: npm ci

      - name: "RULE: no untranslated user-facing strings in web/src"
        if: steps.detect.outputs.present == 'true'
        working-directory: web
        run: npm run lint:i18n

      - name: "RULE: main bundle <= 250 KB gzipped"
        if: steps.detect.outputs.present == 'true'
        working-directory: web
        run: npm run check:bundle-size

      - name: "RULE: axe passes on every primary route"
        if: steps.detect.outputs.present == 'true'
        working-directory: web
        run: npm run test:a11y

  # --------------------------------------------------------------------------
  # One required check for branch protection, and one place that says out loud
  # which gates are enforced and which are still pending.
  # --------------------------------------------------------------------------
  structural-gates-status:
    name: Structural gates status
    if: always()
    needs:
      - rls-coverage
      # Beside rls-coverage deliberately: the two are halves of one property. RLS says which rows a
      # role may see; grants say whether it can reach the table at all. PR #22 is what a schema
      # looks like with the first and not the second — fully green, and quietly bypassed because
      # nothing could run as the application role.
      - grant-coverage
      - composite-fks
      - policy-routing
      - no-raw-pool
      - obligations
      - secrets
      - migrations
      - dependencies
      - api-contract
      - web-gates
      - tracker-rollup
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every gate succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$NEEDS"
          {
            echo "## Structural gates"
            echo ""
            echo "Gates reporting ⏳ PENDING above are **not enforced yet**. They are wired and will"
            echo "start blocking the moment their dependency lands (ENC-105/106, ENC-110, M1, M6)."
          } >> "$GITHUB_STEP_SUMMARY"
          if echo "$NEEDS" | grep -qE '"result"[[:space:]]*:[[:space:]]*"(failure|cancelled|skipped)"'; then
            echo "::error title=Structural gate failed::A structural rule was broken — the failing check's name is the rule. One exception, and it names itself: if the failing job stopped in its 'Fetch dependencies' step, the registry was unavailable and that job's rule was never evaluated. Its annotation says so explicitly; anything else is a real finding."
            exit 1
          fi
          echo "Every structural gate that is currently enforceable passed."
