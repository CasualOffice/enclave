# The always-on gate for every change. Everything here is also runnable locally
# (CONTRIBUTING.md "Local gate") — CI must never be the only place a rule lives.
#
# Jobs are deliberately separate and independent so they run in parallel and a
# failure names *what* broke (formatting vs lint vs tests vs build) rather than
# reporting one opaque red check.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

# Fail fast: a superseded run on the same PR is cancelled immediately so the
# newest commit gets the runners. Pushes to main are never cancelled — main's
# history must have a verdict for every commit.
concurrency:
  # On a pull request the group is the PR, and a new push cancels the run in flight: only
  # the tip is worth testing. On a push to `main` the group is the **commit**, and that is
  # the part that is easy to get wrong. `cancel-in-progress: false` stops a running job
  # being killed, but it does not stop a newly queued run from displacing the one already
  # *pending* in the same group — so three merges nineteen seconds apart left two of the
  # three commits on `main` with cancelled checks and only the last one tested.
  #
  # That reads as a red `main`. A cancelled required check is indistinguishable from a
  # failing one in the merge box, so the next pull request cannot be merged and the cause
  # is a scheduling artefact rather than anything in the tree. Keying on `github.sha`
  # gives every commit on `main` its own group, which is what "every commit on main is
  # tested" actually requires.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Incremental artifacts are large, cache-hostile and useless on a clean runner.
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  fmt:
    name: fmt — cargo fmt --check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install the pinned toolchain
        run: |
          set -euo pipefail
          channel=$(grep -E '^[[:space:]]*channel' rust-toolchain.toml | head -1 | sed -E 's/.*"(.*)".*/\1/')
          echo "rust-toolchain.toml pins: $channel"
          rustup toolchain install "$channel" --profile minimal --component rustfmt,clippy --no-self-update
          rustup default "$channel"
          ver=$(rustc --version); echo "$ver"
          case "$ver" in
            *"$channel"*) ;;
            *) echo "::error title=Toolchain drift::CI is running $ver, not the pinned $channel from rust-toolchain.toml"; exit 1 ;;
          esac

      - name: cargo fmt --all -- --check
        run: cargo fmt --all -- --check

  clippy:
    name: clippy — --workspace --all-targets -D warnings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install the pinned toolchain
        run: |
          set -euo pipefail
          channel=$(grep -E '^[[:space:]]*channel' rust-toolchain.toml | head -1 | sed -E 's/.*"(.*)".*/\1/')
          echo "rust-toolchain.toml pins: $channel"
          rustup toolchain install "$channel" --profile minimal --component rustfmt,clippy --no-self-update
          rustup default "$channel"
          ver=$(rustc --version); echo "$ver"
          case "$ver" in
            *"$channel"*) ;;
            *) echo "::error title=Toolchain drift::CI is running $ver, not the pinned $channel from rust-toolchain.toml"; exit 1 ;;
          esac

      # Keyed on Cargo.lock (dependency graph) and rust-toolchain.toml (compiler
      # version): either changing invalidates every compiled artifact.
      - name: Cache cargo registry and target
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-clippy-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-clippy-${{ hashFiles('rust-toolchain.toml') }}-
            ${{ runner.os }}-cargo-clippy-

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: test — cargo test --workspace
    runs-on: ubuntu-latest

    # The suite needs a real PostgreSQL. Without one, 24 of the workspace's tests are silently
    # skipped — including `no_transaction_ever_observes_another_tenants_context`, the
    # pool-exhaustion proof that plan decision D3 is scheduled against, and the RLS coverage
    # assertions. A green tick over a suite that never ran its tenant-isolation proofs is worse
    # than a red one, because it is believed.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: enclave
          POSTGRES_PASSWORD: enclave
          POSTGRES_DB: enclave
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U enclave"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10


    env:
      # The harness creates a throwaway database per test binary from this one, so it must point at
      # a database whose role may CREATE DATABASE.
      DATABASE_URL: postgres://enclave:enclave@localhost:5432/enclave
      TEST_S3_ENDPOINT: http://localhost:9000
      TEST_S3_ACCESS_KEY_ID: enclave
      TEST_S3_SECRET_ACCESS_KEY: enclave-dev-secret
      # The unprefixed pair, for `reachability.rs`, which runs in this job as well as its own and
      # starts the real binary. It passes these to the child with `inherited(…)` rather than writing
      # them into the generated `enclave.yaml`, because rule 11 refuses a literal credential in
      # configuration — so an unset variable reaches the child as empty and `HeadBucket` fails
      # signature verification. The bucket existed; the credentials did not.
      #
      # `TEST_S3_*` is the BlobStore suite's own prefix and cannot serve both: those tests read it
      # directly, the binary reads `storage.s3.access_key_id: "env://S3_ACCESS_KEY_ID"`.
      S3_ACCESS_KEY_ID: enclave
      S3_SECRET_ACCESS_KEY: enclave-dev-secret
      # Debug info is the overwhelming majority of `target/`, and a hosted runner has ~14 GB free.
      # This workspace links one statically-linked test binary per test target — each carrying the
      # whole dependency graph, aws-lc-sys and ClamAV bindings included — and adding two more in
      # ENC-146 was what tipped it over: the linker died with SIGBUS, which is what a full
      # filesystem looks like when `ld` is writing through an mmap rather than a `write(2)`.
      #
      # `line-tables-only` keeps what a backtrace needs — file and line for every frame, so a
      # panic in CI still says where — and drops the type and variable descriptions that nothing
      # here reads, because nobody attaches a debugger to a CI runner. Set only on this job, so
      # local builds keep full debug info.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only

    steps:
      - uses: actions/checkout@v7

      - name: Reclaim runner disk
        # The hosted image ships ~25 GB of toolchains this workspace never uses. Removing them is
        # faster than the build that would otherwise fail, and it is done *before* the cache is
        # restored so the reported figure describes what the build actually gets.
        run: |
          set -euo pipefail
          echo "Before:"; df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          echo "After:";  df -h / | tail -1

      - name: Install the pinned toolchain
        run: |
          set -euo pipefail
          channel=$(grep -E '^[[:space:]]*channel' rust-toolchain.toml | head -1 | sed -E 's/.*"(.*)".*/\1/')
          echo "rust-toolchain.toml pins: $channel"
          rustup toolchain install "$channel" --profile minimal --component rustfmt,clippy --no-self-update
          rustup default "$channel"
          ver=$(rustc --version); echo "$ver"
          case "$ver" in
            *"$channel"*) ;;
            *) echo "::error title=Toolchain drift::CI is running $ver, not the pinned $channel from rust-toolchain.toml"; exit 1 ;;
          esac

      - name: Cache cargo registry and target
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-${{ hashFiles('rust-toolchain.toml') }}-
            ${{ runner.os }}-cargo-test-

      # ----------------------------------------------------------------------
      # Dependency fetch, retried. THE FETCH ONLY.
      #
      # main went red on 2026-08-20 with `failed to get successful HTTP response
      # from https://index.crates.io/... got 503` — a CDN having a bad minute,
      # reported under the name of whichever check happened to be running. That
      # is the same disease as ENC-503: a gate whose red state can mean
      # "infrastructure" but says "security" is a gate people learn to re-run
      # rather than read.
      #
      # Pulling the fetch out into its own step is what fixes it. `cargo fetch
      # --locked` is the only network I/O in this job that talks to crates.io;
      # once it succeeds every dependency and index entry is on disk, and the
      # `cargo test` below resolves entirely from Cargo.lock and the local cache.
      # So a registry outage now fails HERE, in a step that says "registry", and
      # the assertions below either run properly or do not run at all.
      #
      # DO NOT WIDEN THIS TO THE COMMANDS BELOW. A retry around an assertion is a
      # machine for converting an intermittent security failure into a green
      # build: three attempts at "is EICAR quarantined" passes on the run where
      # the answer was no, once. Fetching is idempotent and has no verdict;
      # asserting has a verdict and gets exactly one attempt, every time.
      #
      # Only this job and `role-race` carry it, because only they assert security
      # properties. `fmt`, `clippy` and `build` are named after what they do, so a
      # registry 503 there is already reported as "the build could not fetch" and
      # misattributes to nothing.
      # ----------------------------------------------------------------------
      - name: Fetch dependencies (retried — registry only)
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4; do
            if cargo fetch --locked; then
              echo "dependencies fetched on attempt ${attempt}"
              exit 0
            fi
            if [ "$attempt" -lt 4 ]; then
              delay=$((attempt * attempt * 5))
              echo "crates.io fetch failed (attempt ${attempt}/4); retrying in ${delay}s"
              sleep "$delay"
            fi
          done
          echo "::error title=Dependency registry unavailable — NOT a test failure::cargo could not fetch from index.crates.io after 4 attempts over ~70s. No test ran: nothing was asserted and nothing failed. Check https://status.crates.io and re-run the job."
          exit 1

      # Tests that need live infrastructure are #[ignore]d until ENC-112 lands the
      # testcontainers harness; they are then run by their own job, not by removing
      # the ignore. CLAUDE.md: a security test is never skipped to get a build green.
      - name: Start MinIO
        # A step rather than a service container: MinIO's entrypoint needs `server /data`, and
        # service containers cannot specify a command.
        #
        # Object storage is here for the same reason PostgreSQL is. The BlobStore tests assert
        # things only a real S3 implementation can answer — that a pre-signed URL expires, that a
        # multipart upload reassembles, that a public bucket is refused. A mock would assert that
        # our mock behaves the way we assumed S3 does, which is the belief under test.
        run: |
          set -euo pipefail
          # Pull before running, with retries. `docker run` pulls implicitly and gives up on the
          # first failure: a registry that answers `unexpected EOF` mid-layer exits 125, and 125 is
          # indistinguishable in the checks list from a test that found a defect. It has already
          # cost one green pull request an hour of diagnosis. `ENC-140` records that this image has
          # no mirror on ghcr.io, quay.io under either plausible org, or public.ecr.aws, so there
          # is no second source to fall back to — only a second attempt.
          pull() {
            for attempt in 1 2 3; do
              if docker pull "$1"; then return 0; fi
              echo "::warning title=Image pull failed::$1 (attempt $attempt of 3)"
              sleep $(( attempt * 10 ))
            done
            echo "::error title=Image pull failed after 3 attempts::$1 — this is a registry fault, not a test failure"
            return 1
          }
          pull quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
          pull quay.io/minio/mc:RELEASE.2025-04-16T18-13-26Z
          docker run -d --name enclave-minio \
            -e MINIO_ROOT_USER=enclave \
            -e MINIO_ROOT_PASSWORD=enclave-dev-secret \
            -p 9000:9000 \
            quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z server /data
          for _ in $(seq 1 60); do
            if curl -sf http://localhost:9000/minio/health/live >/dev/null; then
              # The bucket has to exist before anything starts `enclave-api`, and the reachability
              # test does exactly that inside this job. `connect_and_verify` refuses a missing
              # bucket at start-up, so without this the binary exits before binding and the test
              # reports "never answered /health/live" — a message about the port, for a fault in
              # the bucket. The BlobStore tests create their own buckets and did not need it.
              docker run --rm --network host \
                -e MC_HOST_local=http://enclave:enclave-dev-secret@localhost:9000 \
                quay.io/minio/mc:RELEASE.2025-04-16T18-13-26Z \
                mb --ignore-existing local/enclave-content
              echo "MinIO is ready and enclave-content exists"; exit 0
            fi
            sleep 2
          done
          echo "::error title=MinIO did not become ready::the storage tests cannot run"
          docker logs enclave-minio | tail -40
          exit 1

      - name: Pull the ClamAV image
        # Split from "Start ClamAV" below on purpose (ENC-503). This step is a transaction with
        # Docker Hub; the next one runs `docs/12-TESTING.md §4.8` G1 — an EICAR upload is
        # quarantined and never becomes readable. They fail for entirely different reasons and
        # must therefore fail in different steps, with different words. A red check that reads
        # "G1 could not run" and actually means "Docker Hub said 429" teaches everyone here that
        # the antivirus gate is flaky, and the next person to see it red waves through the run
        # where EICAR really did come back readable.
        #
        # The pull is anonymous, because there is nothing to authenticate with: no mirror of
        # `clamav/clamav` exists — quay, ghcr and ECR were all checked. Anonymous Hub pulls are
        # budgeted at 100 per six hours per source IP (the figure is stated inside the token Hub
        # issues), and hosted runners share egress addresses with every other repository on the
        # same host, so exhausting a budget nobody in this repository spent is ordinary weather.
        #
        # Retried because a 5xx or a dropped TLS handshake clears in seconds. A 429 will not: the
        # budget resets in hours, so it burns all three attempts and lands on the message below,
        # which is the actual deliverable here. Only the *pull* is retried — see the assertion
        # steps, which get exactly one attempt each, always.
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if docker pull clamav/clamav:1.4; then
              echo "clamav/clamav:1.4 pulled on attempt ${attempt}"
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              delay=$((attempt * 10))
              echo "Docker Hub pull failed (attempt ${attempt}/3); retrying in ${delay}s"
              sleep "$delay"
            fi
          done
          echo "::error title=ClamAV image pull failed — REGISTRY, not a security failure::docker pull clamav/clamav:1.4 failed three times against Docker Hub. G1 (EICAR is quarantined, docs/12-TESTING.md §4.8) was NOT evaluated — nothing was asserted and nothing failed. Anonymous Hub pulls are limited to 100 per six hours per source IP and hosted runners share addresses, so a 429 here is a shared-budget exhaustion, not a defect in this change; it resets in hours. No mirror of clamav/clamav exists (quay, ghcr and ECR checked — ENC-503). Re-run the job."
          exit 1

      - name: Start ClamAV
        # Third service in this job, added for the same reason as the first two and after the same
        # mistake twice: `cargo test --workspace -- --include-ignored` below runs *every* ignored
        # test, so an ignore is not insulation from CI. `crates/antivirus/tests/eicar.rs` is
        # `docs/12-TESTING.md §4.8` G1 — an EICAR upload is quarantined and never becomes
        # readable — and without a daemon here it fails the job rather than being skipped.
        #
        # A step rather than a service container because the readiness signal is a protocol
        # round-trip, not an HTTP endpoint, and because `clamav/clamav` needs its database loaded
        # before it binds the port — a `--health-cmd` on a service container would report healthy
        # too early. The tests default to 127.0.0.1:3310, so no variable has to be threaded
        # through this job's shared `env:` block.
        #
        # `1.4` rather than a digest, unlike MinIO above: the tag is the maintained patch series,
        # and pinning a digest here would freeze the signature database baked into the image,
        # which is precisely the thing that should keep moving. `CLAMAV_NO_FRESHCLAMD` stops the
        # updater daemon — the image ships a database, and a background download is latency and
        # network flakiness for no test value.
        #
        # `--pull never`: the image is already local, and this keeps the split above honest. If it
        # somehow is not, this fails saying the image is missing rather than quietly issuing a
        # second anonymous pull from inside the step that is supposed to be about the daemon.
        run: |
          set -euo pipefail
          docker run -d --name enclave-clamav --pull never \
            -e CLAMAV_NO_FRESHCLAMD=true \
            -e CLAMAV_NO_MILTERD=true \
            -p 3310:3310 \
            clamav/clamav:1.4
          # `zPING` over the same protocol the client speaks: an open port is not readiness if the
          # daemon is still parsing signatures, and a PONG is.
          for _ in $(seq 1 90); do
            if printf 'zPING\0' | timeout 5 nc -w 5 127.0.0.1 3310 2>/dev/null | grep -q PONG; then
              echo "clamd is ready"; exit 0
            fi
            sleep 4
          done
          echo "::error title=clamd did not become ready — INFRASTRUCTURE, not a security failure::the daemon never answered zPING with PONG, so G1 (EICAR is quarantined, docs/12-TESTING.md §4.8) was NOT evaluated. The container log below says why it did not start."
          docker logs enclave-clamav | tail -40
          exit 1

      - name: Pull the Milvus image
        # Split from "Start Milvus" for the reason ENC-503 gives above: this step is a transaction
        # with Docker Hub, the next one is a database starting, and a red check must say which.
        #
        # `milvusdb/milvus` publishes to Docker Hub only — the same position ENC-140 recorded — and
        # the pull is anonymous. Note for anyone reproducing a failure locally: a *stale* Docker Hub
        # credential makes the daemon send it and receive `401 Unauthorized` on images that are
        # anonymously pullable, on every image, not just this one. It reads exactly like a rate
        # limit and is fixed by `docker logout` (ENC-522). Runners have no stored credential, so it
        # cannot happen here.
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if docker pull milvusdb/milvus:v2.5.4; then
              echo "milvusdb/milvus:v2.5.4 pulled on attempt ${attempt}"
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              delay=$((attempt * 10))
              echo "Docker Hub pull failed (attempt ${attempt}/3); retrying in ${delay}s"
              sleep "$delay"
            fi
          done
          echo "::error title=Milvus image pull failed — REGISTRY, not a search failure::docker pull milvusdb/milvus:v2.5.4 failed three times against Docker Hub. The vector-index tests in crates/search were NOT evaluated — nothing was asserted and nothing failed. Anonymous Hub pulls are budgeted per source IP and hosted runners share addresses, so a 429 here is shared-budget exhaustion rather than a defect in this change. Re-run the job."
          exit 1

      - name: Start Milvus
        # Standalone with **embedded etcd and local storage**, which is why this needs no etcd and
        # no MinIO container: `ETCD_USE_EMBED` plus `COMMON_STORAGETYPE=local` is the configuration
        # Milvus's own `standalone_embed.sh` uses. The MinIO already running in this job is for the
        # storage tests and is deliberately not shared — a Milvus writing segments into the bucket
        # those tests assert over would make each suite's failures depend on the other's ordering.
        #
        # Why a real server rather than a fake: `crates/search/tests/milvus.rs` asserts that the
        # collection Milvus *actually creates* carries `tenant_id` as its partition key, and that an
        # index deliberately holding over-permissive `acl_tokens` still decides nothing (S5,
        # docs/12-TESTING.md §4.3). A fake would assert that our fake matches our belief about
        # Milvus, and the belief is the thing under test. It has already earned this: the collection
        # schema was rejected by the real server on first contact (ENC-523).
        run: |
          set -euo pipefail
          cat > /tmp/embedEtcd.yaml <<'EOF'
          listen-client-urls: http://0.0.0.0:2379
          advertise-client-urls: http://0.0.0.0:2379
          quota-backend-bytes: 4294967296
          auto-compaction-mode: revision
          auto-compaction-retention: '1000'
          EOF
          printf '# no overrides\n' > /tmp/user.yaml
          docker run -d --name enclave-milvus --pull never \
            --security-opt seccomp:unconfined \
            -e ETCD_USE_EMBED=true \
            -e ETCD_DATA_DIR=/var/lib/milvus/etcd \
            -e ETCD_CONFIG_PATH=/milvus/configs/embedEtcd.yaml \
            -e COMMON_STORAGETYPE=local \
            -v /tmp/embedEtcd.yaml:/milvus/configs/embedEtcd.yaml \
            -v /tmp/user.yaml:/milvus/configs/user.yaml \
            -p 19530:19530 -p 9091:9091 \
            milvusdb/milvus:v2.5.4 milvus run standalone
          # `/healthz` on the management port, not an open 19530: the gRPC port binds before the
          # coordinators have registered, and a test that connects then is told the collection does
          # not exist rather than being made to wait.
          for _ in $(seq 1 90); do
            if curl -sf http://localhost:9091/healthz >/dev/null 2>&1; then
              echo "Milvus is ready"; exit 0
            fi
            sleep 4
          done
          echo "::error title=Milvus did not become ready — INFRASTRUCTURE, not a search failure::the server never answered /healthz, so the vector-index tests in crates/search were NOT evaluated. The container log below says why it did not start."
          docker logs enclave-milvus | tail -60
          exit 1

      - name: Fetch the OCR models
        # Split from the tests for the reason ENC-503 gives about ClamAV: this step is a transaction
        # with a CDN, the tests are `ENC-535`'s assertions about our wiring, and a red check must say
        # which. A failure here means the models were not fetched — it does not mean OCR is broken.
        #
        # **Fetched, never committed.** The published ocrs models are CC-BY-SA-4.0, which
        # `deny.toml` excludes and which `cargo deny` structurally cannot see, because the crate is
        # permissively licensed and weights are not a crate (`ENC-535`). Downloading them into a
        # throwaway CI runner to run tests is use, not redistribution; baking them into an image or
        # committing them to the tree would be redistribution, and is why neither happens.
        #
        # These are the two files `ocrs`'s own `download-models.sh` fetches. **Not** the `.rten`
        # files on the Hugging Face model card: those are training checkpoints that do not fail —
        # they return plausible nonsense, and on a blank page hallucinate lines of single characters
        # (`ENC-536`). Wrong weights would make these tests fail confusingly rather than cleanly.
        run: |
          set -euo pipefail
          base=https://ocrs-models.s3-accelerate.amazonaws.com
          mkdir -p "${RUNNER_TEMP}/ocr-models"
          for model in text-detection text-recognition; do
            fetched=0
            for attempt in 1 2 3; do
              if curl -fsSL --max-time 120 -o "${RUNNER_TEMP}/ocr-models/${model}.rten" "${base}/${model}.rten"; then
                fetched=1; break
              fi
              if [ "$attempt" -lt 3 ]; then
                # `&& sleep` here would be a bug: on the last attempt the test is false, the
                # compound returns non-zero, and `set -e` kills the step before the error message
                # below is ever printed — turning a legible download failure into a bare exit code.
                sleep $((attempt * 10))
              fi
            done
            if [ "$fetched" -ne 1 ]; then
              echo "::error title=OCR model download failed — NETWORK, not a test failure::${model}.rten could not be fetched from ${base} after 3 attempts. The OCR tests in crates/indexing were NOT evaluated — nothing was asserted and nothing failed. Re-run the job."
              exit 1
            fi
            echo "${model}.rten $(stat -c%s "${RUNNER_TEMP}/ocr-models/${model}.rten") bytes"
          done
          echo "ENCLAVE_OCR_MODELS=${RUNNER_TEMP}/ocr-models" >> "$GITHUB_ENV"

      - name: Fetch PDFium
        # Same shape and the same reason as the OCR models above: a transaction with a release host,
        # split from the assertions so a red check says which of the two failed. A failure here means
        # the library was not fetched — it does not mean PDF rasterisation is broken.
        #
        # **Fetched, never committed** — and here that is not a licence problem, unlike the OCR
        # weights. It is a binary-artefact problem: 7 MB of shared object per platform, content
        # nobody reviews in a diff, invisible to `cargo deny` because it is not a crate. Staging it
        # in a throwaway runner is how `crates/indexing/tests/pdf.rs` gets to run without any of that
        # entering the tree (`ENC-537`).
        #
        # **The licence of what is fetched**, since something is being pulled into a build: PDFium
        # itself is **BSD-3-Clause** (`licenses/pdfium.txt` in the archive) and the packaging around
        # it is **MIT** (`LICENSE`, © Benoit Blanchon). The bundled third-party libraries are
        # permissive too — FreeType under the BSD-style FTL rather than its GPLv2 alternative, plus
        # zlib, libpng, libjpeg-turbo, lcms, OpenJPEG, ICU, Abseil, simdutf. All inside `deny.toml`'s
        # allowlist. Nothing here is redistributed by us in any case.
        #
        # `pdfium-*` and **not** `pdfium-v8-*`: the V8 archives embed a JavaScript engine and enable
        # PDF scripting. `args.gn` in the archive fetched below reads `pdf_enable_v8 = false` and
        # `pdf_enable_xfa = false`, which is the build this depends on — a page tree is already the
        # widest attack-surface class in the product without a JIT and an XML forms parser behind it.
        #
        # The tag is pinned to `chromium/7881` and is **an ABI pair with the `pdfium_7881` feature**
        # in the workspace manifest. `pdfium-render` resolves every export eagerly at `dlopen`, so a
        # mismatch fails loudly at the mount rather than subtly at render — but it fails, so the two
        # move together or not at all.
        run: |
          set -euo pipefail
          tag=chromium%2F7881
          archive=pdfium-linux-x64.tgz
          base=https://github.com/bblanchon/pdfium-binaries/releases/download/${tag}
          mkdir -p "${RUNNER_TEMP}/pdfium"
          fetched=0
          for attempt in 1 2 3; do
            if curl -fsSL --max-time 180 -o "${RUNNER_TEMP}/${archive}" "${base}/${archive}"; then
              fetched=1; break
            fi
            if [ "$attempt" -lt 3 ]; then
              # Not `&& sleep`: on the last attempt the test is false, the compound returns
              # non-zero, and `set -e` kills the step before the error message below is printed.
              sleep $((attempt * 10))
            fi
          done
          if [ "$fetched" -ne 1 ]; then
            echo "::error title=PDFium download failed — NETWORK, not a test failure::${archive} could not be fetched from ${base} after 3 attempts. The PDF rasterisation tests in crates/indexing were NOT evaluated — nothing was asserted and nothing failed. Re-run the job."
            exit 1
          fi
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}/pdfium"
          echo "libpdfium.so $(stat -c%s "${RUNNER_TEMP}/pdfium/lib/libpdfium.so") bytes"
          # The build flags travel with the archive; printing them means the "no V8, no XFA" claim
          # above is visible in the log rather than only in this comment.
          cat "${RUNNER_TEMP}/pdfium/args.gn"
          echo "ENCLAVE_PDFIUM=${RUNNER_TEMP}/pdfium/lib" >> "$GITHUB_ENV"

      - name: Cache the converted embedding model
        # Keyed on the model, the converter version and the *shape* of the mount, so a change to any
        # of the three misses and rebuilds. The runner's own key is not in it deliberately: the
        # artefact is platform-independent — a `.rten` graph and a JSON vocabulary — so every job on
        # every runner shares one entry.
        id: embedding-model-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/embedding-model
          key: bge-m3-rten-convert-0.22.0-v1

      - name: Fetch and convert the embedding model
        # Skipped entirely on a cache hit, which is the ordinary case: this is a 2.2 GB download and
        # a conversion, and paying it on every run would dominate the job.
        if: steps.embedding-model-cache.outputs.cache-hit != 'true'
        # Split from the tests for the reason the two steps above are (`ENC-503`): this is a
        # transaction with a CDN and a package index, the tests are `ENC-661`'s assertions about our
        # wiring, and a red check must say which. A failure here means the model was not staged — it
        # does not mean embedding is broken.
        #
        # **Fetched, never committed**, and here the reason is size rather than licence, unlike the
        # OCR weights: `bge-m3` is MIT, and 2.2 GB of weights is content nobody reviews in a diff and
        # a layer every image pull would carry. `docs/08-BYO-INFRA.md §18.1` is the operator-facing
        # copy of this procedure, and the two are meant to stay identical.
        #
        # **Why a conversion step exists.** This build compiles `rten` with `default-features = false`
        # plus `rten_format`, so the ONNX parser is not in the image — an enabled parser nobody uses
        # is still a parser inside a customer's trust boundary. `rten` therefore loads `.rten` and
        # BAAI publishes ONNX.
        #
        # **The converter version is pinned to the one the runtime ships.** `rten-convert 0.22.0` is
        # the version in `rten`'s own `v0.24.0` tag, which is the `rten` this workspace locks. A
        # converter ahead of the runtime writes a format the runtime cannot read, and the failure
        # surfaces as a model that will not load rather than as a version mismatch.
        run: |
          set -euo pipefail
          mount="${RUNNER_TEMP}/embedding-model"
          work="${RUNNER_TEMP}/bge-m3-onnx"
          base=https://huggingface.co/BAAI/bge-m3/resolve/main/onnx
          mkdir -p "${mount}" "${work}"

          # `model.onnx_data` is the external tensor data and must sit beside `model.onnx`, or the
          # conversion produces a graph with no weights — which loads, runs, and returns noise. That
          # is the `ENC-536` failure shape in a different artefact, so it is stated here rather than
          # discovered.
          for f in model.onnx model.onnx_data tokenizer.json; do
            fetched=0
            for attempt in 1 2 3; do
              if curl -fsSL --max-time 900 -o "${work}/${f}" "${base}/${f}"; then
                fetched=1; break
              fi
              if [ "$attempt" -lt 3 ]; then
                # Not `&& sleep`: on the last attempt the test is false, the compound returns
                # non-zero, and `set -e` kills the step before the message below is printed.
                sleep $((attempt * 10))
              fi
            done
            if [ "$fetched" -ne 1 ]; then
              echo "::error title=Embedding model download failed — NETWORK, not a test failure::${f} could not be fetched from ${base} after 3 attempts. The embedding tests in crates/embeddings and crates/worker were NOT evaluated — nothing was asserted and nothing failed. Re-run the job."
              exit 1
            fi
            echo "${f} $(stat -c%s "${work}/${f}") bytes"
          done

          python3 -m venv "${RUNNER_TEMP}/rten-convert"
          "${RUNNER_TEMP}/rten-convert/bin/pip" install --quiet 'rten-convert==0.22.0' || {
            echo "::error title=rten-convert install failed — PACKAGE INDEX, not a test failure::the converter could not be installed, so the embedding model was not staged and the embedding tests were NOT evaluated. Re-run the job."
            exit 1
          }

          "${RUNNER_TEMP}/rten-convert/bin/rten-convert" "${work}/model.onnx" "${mount}/model.rten"
          cp "${work}/tokenizer.json" "${mount}/tokenizer.json"
          # Freed before the build: the ONNX source is 3.5 GB and this runner has died in the linker
          # for want of disk before (`ENC-156`).
          rm -rf "${work}"
          echo "model.rten $(stat -c%s "${mount}/model.rten") bytes"

      - name: Point the tests at the embedding model
        # Its own step so it runs on a cache hit as well as after a conversion. Folding it into the
        # step above would leave `ENCLAVE_EMBEDDING_MODEL` unset on every cached run, and the tests
        # that need it would silently report as ignored rather than failing — which is exactly the
        # class of green-for-the-wrong-reason this repository keeps finding.
        run: |
          set -euo pipefail
          test -s "${RUNNER_TEMP}/embedding-model/model.rten"
          test -s "${RUNNER_TEMP}/embedding-model/tokenizer.json"
          echo "ENCLAVE_EMBEDDING_MODEL=${RUNNER_TEMP}/embedding-model" >> "$GITHUB_ENV"

      - name: Report free disk before building
        # So that the next time this job dies in the linker, the log says why on the line above it
        # rather than leaving a bus error to be diagnosed from first principles (ENC-156).
        run: df -h / | tail -1

      - name: cargo test --workspace
        # `--skip` excludes the one test that cannot share a cluster: it drops the cluster-wide
        # roles to recreate the race it exists to prove, which would break every other binary
        # holding a database. It runs in the `role-race` job below, against its own server.
        run: cargo test --workspace --locked -- --include-ignored --skip a_lost_role_creation_race

      - name: Report free disk after building
        if: always()
        run: df -h / | tail -1

      - name: Report which tests this job did not execute
        # `cargo test -- --ignored --list` lists every test *carrying* `#[ignore]`. It does not and
        # cannot know what the preceding step ran, so under the `--include-ignored` above that list
        # is a roster of tests which **did** execute. Printing it under the heading "Tests that did
        # not run in this job" therefore asserted the exact opposite of what happened.
        #
        # It was believed. `ENC-893` was filed as a P1 off this output: it names
        # `s5_an_over_permissive_index_decides_nothing` — a `docs/12-TESTING.md §4` leakage-matrix
        # row — under that heading, and the row concluded that the live-index half of `S5` had never
        # run in CI and was proven only on a developer's laptop. It had run, against the Milvus this
        # job has started since `ENC-503`, in every run of this workflow. A step whose stated
        # purpose is catching tests that silently do not run, and which mislabels seven that do, is
        # the `ENC-543` shape pointing the other way: there the gate reported `pass` without
        # inspecting anything, here the report cries skipped over a suite that is green.
        #
        # So the heading now says what the list is. The set this job genuinely does not execute is
        # the `--skip` argument above, and it is named rather than derived so that a second `--skip`
        # appearing later is a visible edit to this line rather than a silent absorption.
        if: always()
        run: |
          set -euo pipefail
          echo "Carrying #[ignore] — and EXECUTED by this job, because the run above passes"
          echo "--include-ignored. This is a roster of what ran, not of what was skipped:"
          cargo test --workspace --locked -- --ignored --list 2>/dev/null || true
          echo
          echo "NOT executed by this job: a_lost_role_creation_race, and nothing else."
          echo "It drops cluster-global roles, so it runs alone in the role-race job below."

  build:
    name: build — release binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install the pinned toolchain
        run: |
          set -euo pipefail
          channel=$(grep -E '^[[:space:]]*channel' rust-toolchain.toml | head -1 | sed -E 's/.*"(.*)".*/\1/')
          echo "rust-toolchain.toml pins: $channel"
          rustup toolchain install "$channel" --profile minimal --component rustfmt,clippy --no-self-update
          rustup default "$channel"
          ver=$(rustc --version); echo "$ver"
          case "$ver" in
            *"$channel"*) ;;
            *) echo "::error title=Toolchain drift::CI is running $ver, not the pinned $channel from rust-toolchain.toml"; exit 1 ;;
          esac

      - name: Cache cargo registry and target
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-${{ hashFiles('rust-toolchain.toml') }}-
            ${{ runner.os }}-cargo-build-

      # --locked proves Cargo.lock is committed and current: a build that silently
      # resolves different versions than the lockfile is not the build we audited.
      - name: cargo build --release
        run: cargo build --workspace --locked --release

      - name: Assert Cargo.lock unchanged
        run: |
          set -euo pipefail
          if ! git diff --quiet -- Cargo.lock; then
            echo "::error title=Cargo.lock drift::The build changed Cargo.lock. Commit the updated lockfile."
            git --no-pager diff -- Cargo.lock
            exit 1
          fi

  role-race:
    name: role-race — the destructive cluster-global test
    runs-on: ubuntu-latest

    # Its own PostgreSQL, because this test drops the roles every other database depends on.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: enclave
          POSTGRES_PASSWORD: enclave
          POSTGRES_DB: enclave
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U enclave"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://enclave:enclave@localhost:5432/enclave

    steps:
      - uses: actions/checkout@v7

      - name: Install the pinned toolchain
        run: |
          set -euo pipefail
          channel=$(grep -E '^[[:space:]]*channel' rust-toolchain.toml | head -1 | sed -E 's/.*"(.*)".*/\1/')
          rustup toolchain install "$channel" --profile minimal --no-self-update
          rustup default "$channel"

      # The fetch, retried; the assertion below is not. See the long comment in
      # the `test` job for why that distinction is the whole point.
      - name: Fetch dependencies (retried — registry only)
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4; do
            if cargo fetch --locked; then
              echo "dependencies fetched on attempt ${attempt}"
              exit 0
            fi
            if [ "$attempt" -lt 4 ]; then
              delay=$((attempt * attempt * 5))
              echo "crates.io fetch failed (attempt ${attempt}/4); retrying in ${delay}s"
              sleep "$delay"
            fi
          done
          echo "::error title=Dependency registry unavailable — NOT a test failure::cargo could not fetch from index.crates.io after 4 attempts over ~70s. The role-race test did not run: nothing was asserted and nothing failed. Check https://status.crates.io and re-run the job."
          exit 1

      - name: Reproduce the role race and assert it is legible
        run: |
          cargo test --locked -p enclave-testing --test role_race -- \
            --include-ignored --exact a_lost_role_creation_race_reports_what_to_do_about_it


  reachability:
    name: reachability — the binary answers every route it registers
    runs-on: ubuntu-latest

    # A job of its own rather than a step inside `test`, and the reason is what a red check says.
    # `test` runs some two thousand assertions; when it goes red it says "something broke" and the
    # reader goes looking. This one has exactly one thing to say — **the product cannot be used** —
    # and it earns the right to say it under its own name: M0-M4 produced 130k lines of tested
    # backend that nothing could reach, and the whole suite was green throughout. See
    # `crates/api/tests/reachability.rs` and `plans/M5A-API-COMPLETION.md` step 2.
    #
    # PostgreSQL **and object storage**. The comment here used to say "PostgreSQL and nothing else …
    # contacts neither Redis nor NATS nor object storage", which was true when it was written and
    # stopped being true when `ENC-770` made `main.rs` compose the real store: the binary now runs
    # `connect_and_verify` against `storage.s3` at start-up and exits if the bucket is unreachable.
    #
    # So this job began failing before a single route was probed — the child process was dead, and
    # the failure read as "every route is unreachable" rather than as "the server did not boot".
    # That is the shape this whole job exists to catch, arriving in the job itself: a comment
    # describing what the binary *used* to need, and nobody re-reading it when the binary changed.
    #
    # Redis and NATS still are not contacted; their variables exist only because the configuration
    # references them.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: enclave
          POSTGRES_PASSWORD: enclave
          POSTGRES_DB: enclave
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U enclave"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # The harness creates a throwaway database per test binary from this one, so it must point at
      # a database whose role may CREATE DATABASE.
      DATABASE_URL: postgres://enclave:enclave@localhost:5432/enclave
      # `reachability.rs` passes these through to the child with `inherited(…)` rather than writing
      # them into the generated `enclave.yaml`, because rule 11 refuses a literal credential in
      # configuration and the test would be exempting itself from a gate it is meant to run under.
      S3_ACCESS_KEY_ID: enclave
      S3_SECRET_ACCESS_KEY: enclave-dev-secret
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only

    steps:
      - uses: actions/checkout@v7

      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Start MinIO
        # A step, not a service container: MinIO's entrypoint needs `server /data` and a service
        # container cannot specify a command. The `test` job documents the same constraint.
        #
        # The bucket must exist before `enclave-api` starts — `connect_and_verify` refuses a missing
        # one, and the job would then fail with an error about credentials rather than the bucket.
        run: |
          set -euo pipefail
          # Pull before running, with retries. `docker run` pulls implicitly and gives up on the
          # first failure: a registry that answers `unexpected EOF` mid-layer exits 125, and 125 is
          # indistinguishable in the checks list from a test that found a defect. It has already
          # cost one green pull request an hour of diagnosis. `ENC-140` records that this image has
          # no mirror on ghcr.io, quay.io under either plausible org, or public.ecr.aws, so there
          # is no second source to fall back to — only a second attempt.
          pull() {
            for attempt in 1 2 3; do
              if docker pull "$1"; then return 0; fi
              echo "::warning title=Image pull failed::$1 (attempt $attempt of 3)"
              sleep $(( attempt * 10 ))
            done
            echo "::error title=Image pull failed after 3 attempts::$1 — this is a registry fault, not a test failure"
            return 1
          }
          pull quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
          pull quay.io/minio/mc:RELEASE.2025-04-16T18-13-26Z
          docker run -d --name enclave-minio-reach \
            -e MINIO_ROOT_USER=enclave \
            -e MINIO_ROOT_PASSWORD=enclave-dev-secret \
            -p 9000:9000 \
            quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z server /data
          for _ in $(seq 1 60); do
            if curl -sf http://localhost:9000/minio/health/live >/dev/null; then
              docker run --rm --network host \
                -e MC_HOST_local=http://enclave:enclave-dev-secret@localhost:9000 \
                quay.io/minio/mc:RELEASE.2025-04-16T18-13-26Z \
                mb --ignore-existing local/enclave-content
              echo "MinIO is ready and enclave-content exists"; exit 0
            fi
            sleep 2
          done
          echo "::error title=MinIO did not become ready::the reachability test cannot start the binary"
          docker logs enclave-minio-reach | tail -40
          exit 1

      - name: Every registered route answers an authenticated caller
        run: |
          cargo test --locked -p enclave-api --test reachability -- \
            --include-ignored --nocapture --test-threads=1

  # Single required check for branch protection. Without it, adding a job means
  # remembering to add it to the protected-branch list, and a forgotten job is a
  # gate that quietly stops blocking anything. (It had drifted three jobs upwards
  # and was sitting above `role-race`, describing the wrong thing.)
  # --------------------------------------------------------------------------
  # The web client, against the real API rather than a fixture.
  #
  # `ENC-928`. Every other browser suite in this repository runs `npm run
  # preview` with no server at all and renders from `src/features/*/fixture.ts`,
  # so ~18,000 lines of React had never once met a real response — its Zod
  # schemas, its auth flow and its error handling were all unverified against
  # the thing they exist to talk to. This job is what makes that false.
  #
  # It is the most expensive job in this file: a Rust build, a database, an
  # object store, a browser and a Vite build, for four minutes or so. That is
  # deliberate and it is the point — the cheap version of this job is the one
  # that stubs the API, and the cheap version proves nothing.
  # --------------------------------------------------------------------------
  web-e2e:
    name: e2e — the web client talks to the real API
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: enclave
          POSTGRES_PASSWORD: enclave
          POSTGRES_DB: enclave
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U enclave"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://enclave:enclave@localhost:5432/enclave
      DATABASE_PLATFORM_URL: postgres://enclave:enclave@localhost:5432/enclave
      REDIS_URL: redis://localhost:6379
      NATS_URL: nats://localhost:4222
      S3_ACCESS_KEY_ID: enclave
      S3_SECRET_ACCESS_KEY: enclave-dev-secret
      CARGO_PROFILE_DEV_DEBUG: line-tables-only

    steps:
      - uses: actions/checkout@v7

      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          cache: npm
          cache-dependency-path: web/package-lock.json

      # `*.localhost` resolves to loopback natively on macOS and in Chrome, and
      # not on Linux, where the stub resolver answers only the bare name. The
      # tenant is the first label of the Host (`CLAUDE.md` rule 3), so without
      # this the dev server has no address and every request in the suite fails
      # to connect — which reads as "the app is broken" rather than as a
      # resolver difference between the machine it was written on and this one.
      - name: Resolve the tenant host
        run: echo "127.0.0.1 tenant-alpha.localhost" | sudo tee -a /etc/hosts

      - name: Start MinIO
        run: |
          set -euo pipefail
          pull() {
            for attempt in 1 2 3; do
              if docker pull "$1"; then return 0; fi
              echo "::warning title=Image pull failed::$1 (attempt $attempt of 3)"
              sleep $(( attempt * 10 ))
            done
            echo "::error title=Image pull failed after 3 attempts::$1 — this is a registry fault, not a test failure"
            return 1
          }
          pull quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
          pull quay.io/minio/mc:RELEASE.2025-04-16T18-13-26Z
          docker run -d --name enclave-minio-e2e \
            -e MINIO_ROOT_USER=enclave \
            -e MINIO_ROOT_PASSWORD=enclave-dev-secret \
            -p 9000:9000 \
            quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z server /data
          for _ in $(seq 1 60); do
            if curl -sf http://localhost:9000/minio/health/live >/dev/null; then
              docker run --rm --network host \
                -e MC_HOST_local=http://enclave:enclave-dev-secret@localhost:9000 \
                quay.io/minio/mc:RELEASE.2025-04-16T18-13-26Z \
                mb --ignore-existing local/enclave-content
              echo "MinIO is ready and enclave-content exists"; exit 0
            fi
            sleep 2
          done
          echo "::error title=MinIO did not become ready::the API cannot start"
          docker logs enclave-minio-e2e | tail -40
          exit 1

      - name: Build the API, the CLI and the worker
        run: cargo build --locked -p enclave-api -p enclave-cli -p enclave-worker

      # The documented setup, run as the README describes it. If this step
      # breaks, the README is wrong — which has happened twice (`ENC-925`).
      - name: Configure and seed
        run: |
          set -euo pipefail
          cp deploy/config/enclave.example.yaml enclave.yaml
          sed -i 's|^\( *\)# *platform_url_env: "DATABASE_PLATFORM_URL"|\1platform_url_env: "DATABASE_PLATFORM_URL"|' enclave.yaml
          # No antivirus engine on this runner and none needed: the suite signs
          # in and reads, it never uploads. `none` + ALLOW_WITH_FLAG is the
          # documented laptop posture (`README.md`, `ENC-926`); `clamav` here
          # would leave `CLAMD_ADDR` unresolvable and refuse to start.
          sed -i 's|^  provider: "clamav"|  provider: "none"|' enclave.yaml
          sed -i 's|^  unsupported_policy: "BLOCK"|  unsupported_policy: "ALLOW_WITH_FLAG"|' enclave.yaml
          ./target/debug/enclave-cli seed
          printf '%s' "$ENCLAVE_E2E_PASSWORD" | ./target/debug/enclave-cli \
            set-password --tenant tenant-alpha --email admin@tenant-alpha.example
        env:
          ENCLAVE_E2E_PASSWORD: ${{ secrets.ENCLAVE_E2E_PASSWORD || 'Walkthrough-Pass-2026!' }}

      - name: Start the API
        run: |
          set -euo pipefail
          ./target/debug/enclave-api > "$RUNNER_TEMP/api.log" 2>&1 &
          for _ in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8080/health/ready >/dev/null; then
              echo "enclave-api is ready"; exit 0
            fi
            sleep 2
          done
          echo "::error title=enclave-api did not become ready::the e2e suite has nothing to talk to"
          tail -60 "$RUNNER_TEMP/api.log"
          exit 1

      # **Before provisioning, not after.** The provisioning step uploads a file
      # and waits for it to become AVAILABLE, and it is this process that
      # publishes it — so starting the worker afterwards means that wait can
      # never succeed. It was second, and the tell was the diagnostic rather
      # than the failure: the step's own `tail` of the worker log reported `No
      # such file or directory`, because the log did not exist yet (`ENC-935`).
      #
      # `POST /uploads/{id}/complete` answers `202 SCANNING` and stops: the
      # antivirus pass and the publish that follows it are the worker's, and no
      # read path serves SCANNING content (rule 9). Without this the upload below
      # never becomes AVAILABLE and `GET /files/{id}` answers 404 forever — which
      # is rule 9 working, not a fault.
      - name: Start the worker
        run: |
          set -euo pipefail
          ./target/debug/enclave-worker > "$RUNNER_TEMP/worker.log" 2>&1 &
          echo "worker started"

      # `seed` writes tenants, users and groups and **no content** — it says so in
      # its own header — so `GET /workspaces` answers `200 {"items":[]}` until
      # something provisions one, and the suite's own guard fires: "the seeded
      # tenant has no workspaces — is the database seeded?". That guard is why
      # this failure was one line to diagnose instead of a screenful of
      # unreadable destructuring, and it is worth keeping in mind that the
      # *product* had the same gap until `ENC-916`: for most of this project's
      # life there was no endpoint that could create a workspace at all.
      #
      # Provisioned over HTTP rather than with SQL, deliberately. A fixture
      # written straight into the database would drift from what the API
      # actually accepts, and this suite exists precisely to stop the two sides
      # believing different things (`ENC-929`). The names are never asserted —
      # the tests read them back from the API — so they only have to be valid.
      - name: Provision a workspace and a library
        run: |
          set -euo pipefail
          host='Host: tenant-alpha.localhost'
          token=$(curl -sf http://127.0.0.1:8080/api/v1/auth/login \
            -H "$host" -H 'Content-Type: application/json' \
            -d "{\"email\":\"admin@tenant-alpha.example\",\"password\":\"$ENCLAVE_E2E_PASSWORD\"}" \
            | python3 -c 'import sys,json; print(json.load(sys.stdin)["accessToken"])')

          workspace=$(curl -sf -X POST http://127.0.0.1:8080/api/v1/admin/workspaces \
            -H "$host" -H "Authorization: Bearer $token" -H 'Content-Type: application/json' \
            -d '{"name":"Continuous Integration","slug":"continuous-integration"}' \
            | python3 -c 'import sys,json; print(json.load(sys.stdin)["id"])')

          library=$(curl -sf -X POST "http://127.0.0.1:8080/api/v1/workspaces/$workspace/libraries" \
            -H "$host" -H "Authorization: Bearer $token" -H 'Content-Type: application/json' \
            -d '{"name":"Specifications","slug":"specifications"}' \
            | python3 -c 'import sys,json; print(json.load(sys.stdin)["id"])')

          # A folder, because the library must not be empty. `home.spec.ts` opens
          # something and asserts it comes back from `GET /me/recent`, and an
          # empty library gives it nothing to open — the same shape as the
          # failure this step was added for (`ENC-931`), one level down.
          #
          # A folder rather than an uploaded file, deliberately: a folder is a row
          # in `files` like any other, so `GET /files/{id}` records recency for it
          # exactly as it would for a document, and it needs no worker, no
          # antivirus and no object round-trip. `ENC-807`'s tests make the same
          # trade for the same reason.
          curl -sf -X POST "http://127.0.0.1:8080/api/v1/libraries/$library/folders" \
            -H "$host" -H "Authorization: Bearer $token" -H 'Content-Type: application/json' \
            -d '{"name":"Drafts"}' > /dev/null

          # A real file, because `home.spec.ts` asserts that opening something puts
          # it in `GET /me/recent` — and a **folder records nothing**.
          # `content.rs` excludes them deliberately ("browsing is not opening"),
          # the recency read filters `node_type = 'FOLDER'` out, and
          # `a_folder_never_appears_in_a_recency_list` is one of the data layer's
          # own tests. Provisioning a folder and expecting recency was `ENC-932`.
          #
          # Three calls, because an upload is three: reserve, PUT the bytes to
          # the signed URL with **both** required headers, then complete.
          # `x-amz-checksum-sha256` is signed into the URL, so the provider
          # rehashes the body and refuses one that disagrees with the digest
          # declared at reserve time.
          printf 'The quick brown fox jumps over the lazy dog.\n' > "$RUNNER_TEMP/ci.txt"
          sha=$(sha256sum "$RUNNER_TEMP/ci.txt" | cut -d' ' -f1)
          size=$(stat -c%s "$RUNNER_TEMP/ci.txt")

          reserve=$(curl -sf -X POST http://127.0.0.1:8080/api/v1/uploads \
            -H "$host" -H "Authorization: Bearer $token" -H 'Content-Type: application/json' \
            -d "{\"libraryId\":\"$library\",\"name\":\"ci.txt\",\"sizeBytes\":$size,\"mimeType\":\"text/plain\",\"sha256\":\"$sha\"}")
          upload=$(printf '%s' "$reserve" | python3 -c 'import sys,json; print(json.load(sys.stdin)["uploadId"])')
          url=$(printf '%s' "$reserve" | python3 -c 'import sys,json; print(json.load(sys.stdin)["uploadUrl"])')
          ctype=$(printf '%s' "$reserve" | python3 -c 'import sys,json; print(json.load(sys.stdin)["requiredHeaders"]["content-type"])')
          csum=$(printf '%s' "$reserve" | python3 -c 'import sys,json; print(json.load(sys.stdin)["requiredHeaders"]["x-amz-checksum-sha256"])')

          curl -sf -X PUT "$url" -H "Content-Type: $ctype" -H "x-amz-checksum-sha256: $csum" \
            --data-binary "@$RUNNER_TEMP/ci.txt" > /dev/null

          curl -sf -X POST "http://127.0.0.1:8080/api/v1/uploads/$upload/complete" \
            -H "$host" -H "Authorization: Bearer $token" -H 'Content-Type: application/json' \
            -d "{\"sizeBytes\":$size,\"sha256\":\"$sha\",\"parts\":[]}" > /dev/null

          # The worker publishes it. `antivirus.provider` is `none` with
          # ALLOW_WITH_FLAG on this runner, so the pass is immediate and the
          # version is recorded SKIPPED rather than CLEAN — but it is still the
          # worker that moves it, so this waits rather than assuming.
          for _ in $(seq 1 30); do
            state=$(curl -sf "http://127.0.0.1:8080/api/v1/libraries/$library/items" \
              -H "$host" -H "Authorization: Bearer $token" \
              | python3 -c 'import sys,json; print(next((i["status"] for i in json.load(sys.stdin)["items"] if i["name"]=="ci.txt"), "ABSENT"))')
            if [ "$state" = "AVAILABLE" ]; then
              echo "provisioned workspace $workspace, library $library, one folder and one file"
              exit 0
            fi
            sleep 2
          done
          echo "::error title=The uploaded file never became AVAILABLE::the worker did not publish it; home.spec.ts will have nothing to open"
          tail -40 "$RUNNER_TEMP/worker.log"
          exit 1
        env:
          ENCLAVE_E2E_PASSWORD: ${{ secrets.ENCLAVE_E2E_PASSWORD || 'Walkthrough-Pass-2026!' }}

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Install the browser
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: The client and the server agree
        working-directory: web
        run: npm run test:e2e
        env:
          ENCLAVE_E2E_PASSWORD: ${{ secrets.ENCLAVE_E2E_PASSWORD || 'Walkthrough-Pass-2026!' }}

      # An API that died mid-suite reads as a dozen unrelated client failures,
      # which is a diagnosis nobody reaches from the Playwright output alone.
      - name: The API's own log, on failure
        if: failure()
        run: tail -120 "$RUNNER_TEMP/api.log"

  ci-status:
    name: CI status
    if: always()
    needs: [fmt, clippy, test, build, role-race, reachability, web-e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every CI job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$NEEDS"
          if echo "$NEEDS" | grep -qE '"result"[[:space:]]*:[[:space:]]*"(failure|cancelled|skipped)"'; then
            echo "::error title=CI failed::At least one CI job did not succeed — see the job list above."
            exit 1
          fi
          echo "fmt, clippy, test, build, role-race and reachability all succeeded."
