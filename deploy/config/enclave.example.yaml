# Enclave — example configuration.
#
#   cp deploy/config/enclave.example.yaml enclave.yaml
#
# `enclave.yaml` is git-ignored; this file is the template that is not. It is tuned for the
# development stack in `deploy/compose/dev.yml` and is a *starting point* for a real deployment,
# not a template for one — the notes below say which values must change before anything leaves a
# laptop.
#
# Authoritative shape: `docs/08-BYO-INFRA.md §15`. Precedence: defaults → this file → environment
# (`ENCLAVE_` + `__` between path segments, e.g. `ENCLAVE_SERVER__PORT=9090`) → resolved secrets
# (`docs/03-LLD.md §21`). Anything omitted takes the compiled default, and every default is the
# safe choice, so a short file is a safe file.
#
# ---------------------------------------------------------------------------------------------
# Secrets
# ---------------------------------------------------------------------------------------------
# No credential appears in this file, and none may appear in yours: every field that names one
# holds a *reference* — `env://NAME`, `file:///path`, `vault://path#field`, `k8s://ns/name#key`,
# `awssm://…`, `azkv://…`, `gcpsm://…` (CLAUDE.md rule 11, `docs/08-BYO-INFRA.md §6`). Startup
# scans the merged configuration and refuses to start if a value that looks like a credential was
# written inline, naming the field. That check is the reason this file can be committed at all.
#
# The `*_env` spellings below (`url_env: DATABASE_URL`) are shorthand for `url: env://DATABASE_URL`
# and exist because that is how `docs/08-BYO-INFRA.md §15` writes them.

# What this deployment promises it can do: community | production | enterprise.
# `enterprise` additionally refuses to start with antivirus or the audit trail disabled
# (`docs/08-BYO-INFRA.md §19`), which is exactly why a laptop is `community`.
profile: community

server:
  # Loopback, not 0.0.0.0. A service is exposed deliberately or not at all; a deployment behind a
  # load balancer sets this to 0.0.0.0 *and* fills in trusted_proxies below.
  bind: "127.0.0.1"
  port: 8080
  # Used for the token issuer, the refresh-cookie domain and links in mail. Must be the URL clients
  # actually reach, or tokens will be issued for an audience nobody validates against.
  public_url: "http://localhost:8080"
  # Networks whose X-Forwarded-For may be believed, and how many hops each strips. Empty means the
  # peer address is the client address — the only safe assumption when nothing is known, because a
  # believed forwarding header from an untrusted peer lets any client claim any source IP and walk
  # straight through conditional access (`docs/06-SECURITY-DLP-ACCESS.md`).
  trusted_proxies: []
  # Behind a proxy, this would read:
  # trusted_proxies:
  #   - cidr: "10.20.0.0/16"
  #     hops: 1

# ---------------------------------------------------------------------------------------------
# The Prometheus exposition, on a socket of its own — one section, two ports.
# ---------------------------------------------------------------------------------------------
# `enclave-api` binds `api_port` and `enclave-worker` binds `worker_port`. Two keys because one
# `enclave.yaml` is read by both processes: they used to share `server.metrics_port`, so on a host
# running both, whichever started second died with `Address already in use` (`ENC-566`). The two
# numbers below are the ones `deploy/monitoring/prometheus.yml` scrapes.
#
# In a per-pod deployment the two processes do not share a port namespace and the same number for
# both is correct; nothing refuses that. On one host, give them different ports, as here.
#
# Null disables a listener entirely, and that is the default: a deployment that has not decided
# where this port belongs should not have it open. A worker with no port publishes the coverage
# probe's gauges into a registry nothing scrapes, which reads as zero forever and is
# indistinguishable from healthy — `SearchIndexCoverageUnreported` cannot clear.
#
# It is **not** authenticated and never will be. The exposition carries `tenant_id` labels, so
# `bind` must reach your monitoring and nothing else — a private interface, or loopback with a
# sidecar. `docs/11-OPERATIONS.md §10.1` explains why it is not simply a route on 8080 behind the
# policy chain.
metrics:
  bind: "127.0.0.1"
  api_port: 9464
  worker_port: 9465

database:
  # The dev stack's DSN:
  #   export DATABASE_URL=postgres://enclave:enclave@localhost:5432/enclave
  url_env: "DATABASE_URL"
  # The BYPASSRLS role, and the only three things allowed to hold it are the migration runner, the
  # outbox publisher and the scheduler's tenant enumerator (`plans/M0-FOUNDATIONS.md` D3). Absent
  # here, deliberately: with nothing set there is no row-level-security bypass anywhere in the
  # process, and the paths that need one refuse to start rather than falling back to a pool RLS
  # applies to with no tenant set — which returns zero rows and looks like an empty database.
  #
  # `enclave-api` does not need it. **`enclave-worker` refuses to start without it**, because the
  # query that produces a tenant list cannot itself be scoped to a tenant and every housekeeping
  # pass takes that list as a parameter (`docs/11-OPERATIONS.md §3.1`).
  #
  # platform_url_env: "DATABASE_PLATFORM_URL"
  max_connections: 50
  min_connections: 1
  acquire_timeout: "10s"
  # A server-side cap, so one pathological query cannot hold a pool slot indefinitely.
  statement_timeout: "30s"
  # The non-owner role the application SET ROLEs to after connecting. It is NOBYPASSRLS and owns
  # nothing, so row-level security applies to it unconditionally — that is the second of the two
  # layers behind tenant isolation (`plans/M0-FOUNDATIONS.md` D3).
  application_role: "enclave_app"

redis:
  #   export REDIS_URL=redis://localhost:6379
  url_env: "REDIS_URL"
  pool_size: 16

events:
  #   export NATS_URL=nats://localhost:4222
  nats_url_env: "NATS_URL"
  stream: "vault"
  # Rows claimed per outbox publish pass. Bounded so a backlog drains steadily rather than in one
  # transaction that holds locks for minutes.
  publish_batch: 256

auth:
  access_token:
    # Closed set of one. Never read from the token header — that is the K8 algorithm-confusion
    # defence (`docs/12-TESTING.md §4.6`), and it belongs in configuration precisely so a token
    # cannot influence it.
    algorithm: "EdDSA"
    # Short by design: revoking a bearer token is approximate, so the window is the real control.
    ttl: "10m"
    privileged_ttl: "5m"
    # Omitted on purpose — taken from server.public_url, so it cannot drift from it.
    # issuer: "https://workspace.example.com"
    audience: "enclave-api"
  refresh_token:
    idle_ttl: "14d"
    absolute_ttl: "90d"
    # Rotation is what makes reuse detectable at all: without it there is no consumed token to
    # replay, and therefore no signal.
    rotation: true
    reuse_detection: "REVOKE_FAMILY"
    cookie:
      name: "enclave_rt"
      same_site: "strict"
      # Narrow, so the refresh token is not attached to every API call and therefore not exposed
      # to every handler.
      path: "/api/v1/auth"
      # Stays true in development too. A "just for localhost" exception here has a way of reaching
      # production; use `http://localhost` in a browser that treats it as a secure context, or a
      # local TLS terminator.
      secure: true
  signing_keys:
    # Absent means the development file provider generates an Ed25519 key on first run, under
    # `deploy/config/dev-keys/`, which is git-ignored. No key material is ever committed, not even
    # a throwaway one — throwaway keys get copied into production more often than anyone admits
    # (`plans/M0-FOUNDATIONS.md` D5).
    # A real deployment sets a reference instead:
    # key_ref: "vault://workspace/jwt#ed25519"
    rotation_interval: "90d"
    # How long the retired key stays in the JWKS, so tokens signed just before a rotation still
    # verify. Shorter than the access-token TTL would reject valid tokens.
    overlap: "24h"

security:
  password:
    min_length: 12
    # Bounded, so a very long password cannot turn hashing into a denial of service.
    max_length: 128
    breach_check: true
    argon2:
      memory_kib: 65536
      iterations: 3
      parallelism: 4
    # Mixed into every password hash and held outside the database, so a database dump alone is
    # not enough to mount an offline attack. Unset in development; a reference in production:
    # pepper: "vault://workspace/password#pepper"
  mfa:
    admins_required: true
    step_up_max_age: "15m"
  # What happens when the privileged-token denylist cannot be reached. FAIL_CLOSED locks admins
  # out during an outage; FAIL_OPEN keeps revoked admin tokens working. The first is an incident,
  # the second is a breach.
  privileged_denylist_failure: "FAIL_CLOSED"

dlp:
  enabled: true
  # `monitor` records matches and allows the action; `enforce` blocks. Monitor first so a new
  # deployment does not block work before its rules have been tuned.
  default_mode: "monitor"
  # When the facts a rule needs (classification, labels) cannot be loaded, the rule has not
  # allowed anything.
  facts_unavailable: "FAIL_CLOSED"

audit:
  enabled: true
  # Each event carries the hash of its predecessor, so a retroactive edit is detectable.
  hash_chain: true
  # Where periodic chain anchors are published. An anchor outside the system is what makes the
  # chain evidence rather than self-assertion; unset locally.
  # external_anchor: "s3://enclave-audit-anchor/"
  retention_days: 400

antivirus:
  # Nothing is AVAILABLE before antivirus completes (CLAUDE.md rule 9). The dev stack's ClamAV is
  # behind the `av` Compose profile:
  #   docker compose -f deploy/compose/dev.yml --profile av up -d --wait
  #   export CLAMD_ADDR=tcp://localhost:3310
  provider: "clamav"
  endpoint_env: "CLAMD_ADDR"
  max_scan_bytes: 2147483648
  archive_depth: 5
  timeout: "120s"
  # HOLD keeps an object in SCANNING until a scanner is reachable — the only value consistent with
  # rule 9. ALLOW_AND_RESCAN trades a malware window for availability and must be chosen.
  unavailable_policy: "HOLD"

# ---------------------------------------------------------------------------------------------
# Mounted volumes: OCR
# ---------------------------------------------------------------------------------------------
# Both keys are absent below, deliberately, and that is a working configuration. With neither, a
# scanned or image-only document produces no text, its index manifest records FAILED with
# `no_text_extracted`, and the file is *visibly* unsearchable. That is the intended absence — the
# outcome to avoid is the other one, a document that indexes as empty while appearing correctly
# filed, which is invisible to everybody (`plans/M3-DISCOVERY.md` D24).
#
# Set both to turn OCR on. **Both or neither**: one without the other refuses to start, naming the
# missing key. Weights with no rasteriser is a deployment whose configuration says OCR is on and
# whose scanned PDFs index as empty anyway, and nothing downstream is in a position to report it.
#
# These are *paths*, not credentials — the same class as `antivirus.endpoint`. They are plain
# strings rather than `vault://` references on purpose: a mount point grants access to nothing, and
# putting a directory name behind a secret provider would make a volume that simply is not attached
# look like a failed credential fetch.
#
# Neither artefact is shipped in the image, for two different reasons:
#
#   * the ocrs weights are CC-BY-SA-4.0 — a copyleft *data* licence that `deny.toml`'s
#     permissive-only allowlist excludes and that `cargo deny` structurally cannot see, because the
#     crate is permissive and weights are not a crate. You obtain them; we redistribute nothing.
#   * PDFium is 7 MB of shared object per platform, BSD-3-Clause, that nobody reviews in a diff.
#
# Staging them, once, beside the deployment:
#
#   mkdir -p /var/lib/enclave/ocr-models
#   base=https://ocrs-models.s3-accelerate.amazonaws.com
#   curl -fsSL -o /var/lib/enclave/ocr-models/text-detection.rten   "$base/text-detection.rten"
#   curl -fsSL -o /var/lib/enclave/ocr-models/text-recognition.rten "$base/text-recognition.rten"
#
#   # chromium/7881 is an ABI pair with this build. Not the `pdfium-v8-*` archive: those embed a
#   # JavaScript engine and enable PDF scripting.
#   curl -fsSL -o /tmp/pdfium.tgz \
#     https://github.com/bblanchon/pdfium-binaries/releases/download/chromium%2F7881/pdfium-linux-x64.tgz
#   mkdir -p /var/lib/enclave/pdfium && tar -xzf /tmp/pdfium.tgz -C /var/lib/enclave/pdfium
#
# Then, here or as `ENCLAVE_OCR_MODELS` / `ENCLAVE_PDFIUM` in the environment — the two spellings
# name the same field:
#
# ocr_models: "/var/lib/enclave/ocr-models"   # holds text-detection.rten and text-recognition.rten
# pdfium: "/var/lib/enclave/pdfium/lib"       # the directory, not the file
#
# One more thing to set when you turn this on, and it is not in this file: `RTEN_NUM_THREADS` in
# the worker's environment, matched to its CPU limit. The inference runtime starts a thread pool
# sized from the *host's* core count, which on a limited container is a pool several times larger
# than the cores it may use. `docs/11-OPERATIONS.md §3.2` has the numbers.

# ---------------------------------------------------------------------------------------------
# The embedding model — the third mounted artefact, and the one dense search needs (`ENC-661`).
# ---------------------------------------------------------------------------------------------
#
# `bge-m3` at 1024 dimensions is compiled in as the model this build indexes against
# (`plans/M3-DISCOVERY.md` Q14), so what a deployment supplies is the **weights**, not a name. There
# is no `provider` key and no `model` name: neither is a choice this build can honour, and an inert
# key is a claim an operator acts on.
#
# A path and not a credential, for the same reason as the two mounts above.
#
# Mounted rather than shipped because it is 2.2 GB — an air-gapped install pays that on every image
# pull, for content that changes on a different schedule from the code. Unlike the OCR weights this
# is a size decision and not a licensing one; bge-m3 is MIT.
#
# The directory holds two files:
#
#   model.rten      the converted weights
#   tokenizer.json  the model's own vocabulary, copied unchanged from the model repository
#
# The conversion is one step and `docs/08-BYO-INFRA.md §18.1` is authoritative for it. In short:
# `rten` is compiled here **without** its ONNX parser — an enabled parser nobody uses is still a
# parser inside your trust boundary — so `rten-convert`, at the version the `rten` crate in
# `Cargo.lock` names, turns BAAI's published ONNX export into a `.rten` graph once.
#
#   python3 -m venv /tmp/rten && /tmp/rten/bin/pip install 'rten-convert==0.22.0'
#   base=https://huggingface.co/BAAI/bge-m3/resolve/main/onnx
#   mkdir -p /tmp/bge-m3 && cd /tmp/bge-m3
#   # model.onnx_data is the external tensor data and must sit beside model.onnx.
#   for f in model.onnx model.onnx_data tokenizer.json; do curl -fL -O "$base/$f"; done
#   mkdir -p /var/lib/enclave/bge-m3
#   /tmp/rten/bin/rten-convert model.onnx /var/lib/enclave/bge-m3/model.rten
#   cp tokenizer.json /var/lib/enclave/bge-m3/tokenizer.json
#
# Then, here or as `ENCLAVE_EMBEDDING_MODEL` — the two spellings name the same field:
#
# embedding_model: "/var/lib/enclave/bge-m3"
#
# **Setting this requires `search.provider: milvus`**, and the *worker* refuses to start otherwise,
# naming both keys. Nothing would fail if it were allowed: the weights would load, no stage would be
# built, documents would index exactly as they do now, and dense search would return nothing with no
# error anywhere.
#
# The refusal is the worker's and not the loader's on purpose — `enclave-api` builds no vector stage,
# so exporting ENCLAVE_EMBEDDING_MODEL in a shell must not stop it booting.
#
# **Leaving it unset is a documented absence, not a degradation.** Documents are extracted, chunked
# and committed, so lexical search works; `index_manifests.embedding_model` records an empty string,
# which is the honest value for a deployment where nothing embedded; dense retrieval returns
# nothing, and the worker says so once at start-up.
#
# `RTEN_NUM_THREADS` applies here too, and for the same reason as above — it is the same runtime.

# ---------------------------------------------------------------------------------------------
# Object storage
# ---------------------------------------------------------------------------------------------
# `provider: none` is the default and it is a *refusal*, not a fallback: with no store the worker
# does not schedule the indexing pass, `chunk_text` stays empty and search stays lexical-only. That
# is deliberate. Pointing the pass at a store that cannot answer would be worse — `claim` commits
# before the first byte is read, so every tick would move a batch of manifests into a working state
# and burn the `attempts` budget that quarantines genuinely poisoned documents, then fail.
#
# `provider` and the `s3:` block are written together or not at all. One without the other refuses
# to start, naming the key that is missing, for the same reason the two OCR mounts do: a fully
# specified bucket that nothing reads is invisible from outside.
#
# The credentials are **references**, never values, and there is no field here that can hold a key
# — `access_key_id` and `secret_access_key` are typed such that a literal does not deserialize.
# For the dev stack:
#
#   export S3_ACCESS_KEY_ID=enclave
#   export S3_SECRET_ACCESS_KEY=...          # deploy/compose/dev.yml has the value
storage:
  provider: "s3"
  s3:
    bucket: "enclave-content"
    # SigV4 signs over a region even when MinIO ignores it.
    region: "us-east-1"
    # MinIO from the dev stack. Omit for AWS S3, which derives the endpoint from the region.
    endpoint: "http://localhost:9000"
    # aws | minio | generic. Selects which public-access self-check probes are attempted: MinIO
    # implements neither GetPublicAccessBlock nor GetBucketPolicyStatus, and running them there
    # fills the startup log with "not implemented" until an operator stops reading it.
    flavor: "minio"
    # Path style ({endpoint}/{bucket}/{key}), because a MinIO endpoint has no per-bucket DNS. AWS
    # deployments set this to false. Getting it wrong produces a DNS failure that reads as a
    # network problem.
    path_style: true
    access_key_id: "env://S3_ACCESS_KEY_ID"
    secret_access_key: "env://S3_SECRET_ACCESS_KEY"
    # For temporary credentials only:
    # session_token: "env://S3_SESSION_TOKEN"
    # No S3-compatible backend can invalidate a pre-signed URL before it expires, so these two
    # numbers *are* the control. A caller asking for longer than the ceiling is refused, never
    # clamped (`plans/M1-CONTENT-CORE.md` D14).
    signed_url_ttl: "5m"
    max_signed_url_ttl: "1h"

# ---------------------------------------------------------------------------------------------
# Vector store
# ---------------------------------------------------------------------------------------------
# Behind the `search` Compose profile:
#   docker compose -f deploy/compose/dev.yml --profile search up -d --wait
#
# `provider: none` is again a refusal rather than a fallback: with no store the coverage probe is
# not scheduled and `enclave_search_index_observed_chunks` has no series at all. A census pointed
# at a URI nobody set would be worse — every tenant would count `unreadable`, and the gauges would
# report a fleet-wide outage that is really a missing configuration key.
#
# **There is no key for the embedding width, deliberately.** It is read from
# `enclave_embeddings::model::ACTIVE.dimension`. The width is fixed when the collection is created
# and a mismatch errors at neither end, so the symptom is silently degraded retrieval and the
# correction is re-embedding every chunk of every tenant (`docs/07-SEARCH-INDEXING.md §9`).
search:
  provider: "milvus"
  milvus:
    uri: "http://localhost:19530"
    # An authenticating cluster takes a `user:password` reference. The dev stack does not:
    # token: "vault://workspace/milvus#token"
    # Absent takes the collection `docs/07-SEARCH-INDEXING.md §4` names, which is what every
    # deployment should use; the key exists so a migration between two collections can point.
    # collection: "enclave_chunks"

# ---------------------------------------------------------------------------------------------
# Sections below are not modelled yet — they land with the milestones that implement them
# (`docs/08-BYO-INFRA.md §15`). They are ignored today rather than rejected, so that a complete
# operator file loads unchanged, and they are still scanned for inline credentials. The query-side
# `search` keys (`default_mode`, `dense`, `sparse`, `bm25`, `overfetch_factor`,
# `denylist_degrade_threshold`) are in that category too: not read yet, so they are not written
# above.
# ---------------------------------------------------------------------------------------------

preview:
  sandbox: true
  max_pages: 500
  rendition_cache_bytes: 107374182400
  watermark_cache: false

sync:
  enabled: true
  max_devices_per_user: 5

mcp:
  enabled: true
  write_tools:
    enabled: false

quotas:
  default_storage_bytes: 5497558138880
  soft_limit_pct: 80
